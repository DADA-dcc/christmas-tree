<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Snow Globe · 圣诞雪景球</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    background: radial-gradient(ellipse at 50% 18%, #1e3250 0%, #101a28 48%, #060a12 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select:none; touch-action:manipulation;
  }
  #ambient { position:fixed; inset:0; z-index:0; pointer-events:none; }
  h1 {
    position:relative; z-index:2; color:#ffe9b0; font-size:clamp(20px,5vw,34px); font-weight:700;
    letter-spacing:.08em; margin-bottom:16px; text-align:center; padding:0 12px;
    text-shadow:0 0 16px rgba(255,214,120,.85), 0 0 42px rgba(255,170,60,.45), 0 2px 6px rgba(0,0,0,.6);
  }
  .wrap { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; }
  .globe { position:relative; width:min(78vw,400px); aspect-ratio:1/1.16; -webkit-user-select:none; -webkit-touch-callout:none; user-select:none; touch-action:none; }
  .globe.shaking { animation: shake .7s cubic-bezier(.36,.07,.19,.97); }
  .globe.shaking-mild { animation: shakeMild .36s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    0%,100% { transform:rotate(0) translateX(0); }
    15% { transform:rotate(-4deg) translateX(-10px); }
    30% { transform:rotate(3.5deg) translateX(9px); }
    45% { transform:rotate(-3deg) translateX(-7px); }
    60% { transform:rotate(2.4deg) translateX(6px); }
    75% { transform:rotate(-1.6deg) translateX(-4px); }
    90% { transform:rotate(1deg) translateX(2px); }
  }
  @keyframes shakeMild {
    0%,100% { transform:rotate(0) translate(0,0); }
    20% { transform:rotate(-1.2deg) translate(-3px,-1px); }
    45% { transform:rotate(1.1deg) translate(3px,1px); }
    70% { transform:rotate(-0.7deg) translate(-2px,0); }
    88% { transform:rotate(0.4deg) translate(1px,0); }
  }
  .ball {
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:100%; aspect-ratio:1/1; border-radius:50%; overflow:hidden;
    clip-path:circle(50% at 50% 50%); -webkit-clip-path:circle(50% at 50% 50%);
    background: radial-gradient(circle at 34% 24%, rgba(182,210,245,.26), rgba(136,170,224,.09) 38%, rgba(44,68,100,.22) 68%, rgba(16,26,40,.52) 100%);
    box-shadow:
      inset 0 0 0 1px rgba(212,226,245,.24),
      inset 0 0 60px rgba(136,170,224,.22),
      inset -18px -22px 60px rgba(16,26,40,.58),
      inset 14px 16px 40px rgba(214,230,251,.15),
      0 18px 50px rgba(4,8,16,.65),
      0 0 0 1px rgba(182,210,245,.28),
      0 0 14px rgba(136,170,224,.18);
    cursor:grab;
    -webkit-user-select:none; -webkit-touch-callout:none; user-select:none;
  }
  .ball::after {
    content:""; position:absolute; inset:4px; border-radius:50%;
    border:1.5px solid transparent;
    border-top-color:rgba(255,255,255,.32);
    border-left-color:rgba(210,235,255,.18);
    border-bottom-color:rgba(160,210,255,.12);
    transform:rotate(-24deg);
    box-shadow:inset 0 0 10px rgba(200,230,255,.08);
    pointer-events:none; z-index:4;
  }
  .ball:active { cursor:grabbing; }
  .scene { position:absolute; inset:0; transform-origin:50% 88%; will-change:transform; }
  .scene svg { position:absolute; inset:0; width:100%; height:100%; }
  #skycv, #fogcv, #glasscv { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #skycv { z-index:0; transform:scale(1.08); will-change:transform; }
  .scene { z-index:1; }
  #fogcv { z-index:2; }
  #glasscv { z-index:3; }
  #auroracv, #treecv, #snow { position:absolute; inset:0; width:100%; height:100%; }
  .glare {
    position:absolute; top:9%; left:14%; width:34%; height:22%; border-radius:50%;
    background: radial-gradient(ellipse at 40% 40%, rgba(255,255,255,.70), rgba(255,255,255,0) 70%);
    transform:rotate(-22deg); pointer-events:none; filter:blur(1px); z-index:4;
  }
  .glare2 {
    position:absolute; bottom:12%; right:12%; width:16%; height:9%; border-radius:50%;
    background: radial-gradient(ellipse, rgba(255,255,255,.28), rgba(255,255,255,0) 70%);
    transform:rotate(-20deg); pointer-events:none; z-index:4;
  }
  .base-halo {
    position:absolute; bottom:-2.2%; left:50%; transform:translateX(-50%);
    width:68%; height:21.5%;
    border-radius:18px 18px 26px 26px / 14px 14px 28px 28px;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,216,126,.18) 44%, rgba(255,196,86,.44) 72%, rgba(255,172,58,0) 100%);
    box-shadow: 0 0 18px rgba(255,204,92,.45), inset 0 0 12px rgba(255,228,150,.28);
    border: 1px solid rgba(255,228,148,.38);
    pointer-events:none; opacity:.20; will-change:opacity, transform;
  }
  .base {
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:62%; height:17%;
    background: linear-gradient(180deg, #8a5a2b 0%, #6b421c 40%, #4a2c12 100%);
    border-radius:12px 12px 18px 18px / 10px 10px 22px 22px;
    box-shadow: 0 10px 26px rgba(0,0,0,.6), inset 0 3px 6px rgba(255,220,160,.28), inset 0 -6px 12px rgba(0,0,0,.5);
  }
  .base::before {
    content:""; position:absolute; top:-6%; left:6%; width:88%; height:26%;
    background: linear-gradient(180deg, #a06a33, #7a4c20); border-radius:50%;
    box-shadow: inset 0 2px 4px rgba(255,225,170,.35);
  }
  .plate {
    position:absolute; top:38%; left:50%; transform:translateX(-50%);
    color:#ffd98a; font-size:clamp(8.5px,2.3vw,13px); letter-spacing:.14em; white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.7); font-weight:600;
    padding:4px 10px; border-radius:8px; cursor:pointer;
    transition:opacity .20s ease, letter-spacing .20s ease;
  }
  .hint {
    position:relative; z-index:2; margin-top:24px; color:#9fb4d8; font-size:14px; letter-spacing:.06em;
    background:rgba(255,255,255,.06); padding:9px 18px; border-radius:22px;
    border:1px solid rgba(255,255,255,.10);
  }
  .hint b { color:#ffd98a; }
  .fab {
    position:fixed; bottom:18px; z-index:99; cursor:pointer;
    background:rgba(0,0,0,.62); color:#ffd966; padding:9px 15px; border-radius:22px;
    font-size:14px; font-weight:600; box-shadow:0 4px 16px rgba(0,0,0,.4);
  }
  #bgm-hint { right:18px; }
  #lamp-btn { left:18px; }
  #sky-btn { left:18px; bottom:64px; }

  @keyframes xfxPlateShake{
    0%,100%{ transform:translate(0,0) rotate(0); }
    15%{ transform:translate(-3px,1px) rotate(-2deg); }
    35%{ transform:translate(3px,-1px) rotate(2deg); }
    55%{ transform:translate(-2px,0) rotate(-1deg); }
    75%{ transform:translate(2px,1px) rotate(1deg); }
  }
</style>
</head>
<body>
<canvas id="ambient"></canvas>
<h1>"Merry Christmas" from XS</h1>
<div class="wrap">
  <div class="globe" id="globe">
    <div class="ball" id="ball">
      <canvas id="skycv"></canvas>
      <div class="scene" id="scene">
        <svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMax meet">
          <defs>
            <linearGradient id="snowGradBack" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop id="gb-stop0" offset="0%" stop-color="#b4c4d8"/>
              <stop id="gb-stop1" offset="55%" stop-color="#8b9db4"/>
              <stop id="gb-stop2" offset="100%" stop-color="#66788e"/>
            </linearGradient>
            <linearGradient id="snowGradFront" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop id="gf-stop0" offset="0%" stop-color="#c2cfe0"/>
              <stop id="gf-stop1" offset="52%" stop-color="#9db0c7"/>
              <stop id="gf-stop2" offset="100%" stop-color="#77899f"/>
            </linearGradient>
          </defs>
          <ellipse id="snow-ground-skirt" cx="100" cy="190" rx="84" ry="12" fill="url(#snowGradBack)"/>
          <ellipse id="snow-ground-back" cx="100" cy="178" rx="80" ry="15" fill="url(#snowGradBack)"/>
          <ellipse id="snow-ground-front" cx="100" cy="174" rx="68" ry="11" fill="url(#snowGradFront)"/>
        </svg>
        <canvas id="auroracv"></canvas>
        <canvas id="treecv"></canvas>
        <canvas id="snow"></canvas>
      </div>
      <canvas id="fogcv"></canvas>
      <canvas id="glasscv"></canvas>
      <div class="glare"></div>
      <div class="glare2"></div>
    </div>
    <div class="base-halo" id="base-halo"></div>
    <div class="base"><div class="plate" id="plate">MERRY CHRISTMAS</div></div>
  </div>
  <div class="hint">🫧 <b>摇一摇 / 点一点球</b> 下大雪·积雪变厚</div>
</div>
<div id="sky-btn" class="fab">🌗 极夜</div>
<div id="lamp-btn" class="fab">💡 灯色</div>
<div id="bgm-hint" class="fab">🔊 点击开启音乐</div>
<audio id="bgm" src="bgm2.mp3" loop muted preload="auto"></audio>
<script>
(function(){
  var ball=document.getElementById('ball'), cv=document.getElementById('snow'), ctx=cv.getContext('2d');
  var sceneEl=document.getElementById('scene');
  var skycv=document.getElementById('skycv'), sctx=skycv.getContext('2d');
  var fogcv=document.getElementById('fogcv'), fctx=fogcv.getContext('2d');
  var glasscv=document.getElementById('glasscv'), gctx=glasscv.getContext('2d');
  var frostLayer=document.createElement('canvas'), frctx=frostLayer.getContext('2d'), lastFrostOp=-1;
  var skyBlurLayer=document.createElement('canvas'); skyBlurLayer.width=112; skyBlurLayer.height=112;
  var sbctx=skyBlurLayer.getContext('2d');
  var horizonMistLayer=document.createElement('canvas'); horizonMistLayer.width=160; horizonMistLayer.height=48;
  var hmctx=horizonMistLayer.getContext('2d');
  var W=0,H=0,CX=0,CY=0,R=0, flakes=[], boost=0, lamps=[], accum=0.35, lampMode=0, lastRedraw=0;

// ===== v14 FX 公共基础（aws-quick/smart 生成）=====
var FX_MAX_PARTICLES = 15, fxNow = 0, fxLastNow = 0, fxDt = 0;
function fxCount(){ return (typeof rainDrops!=='undefined'?rainDrops.length:0) + (typeof feathers!=='undefined'?feathers.length:0); }
function fxUpdate(now){ fxDt = fxLastNow ? Math.min(0.05,(now-fxLastNow)/1000) : 0.016; fxLastNow = now; fxNow = now; }
function snowmanAnchor(){
  var bY=H*0.875, tH=H*0.60;
  var s = tH*0.095, x = W/2 + tH*0.415, y = bY + tH*0.045;
  return { x:x, footY:y, headY:y - s*2.6, s:s };
}
function angelAnchor(){ var bY=H*0.875, tH=H*0.60; return { x:W/2, y:bY - tH*0.98, s:tH*0.085 }; }
function fxRoundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}
// 1. 雪人打招呼气泡
var bubble = { next:0, start:-1, text:'', w:0 };
var BUBBLE_TEXTS = ['Hello!','Merry Christmas!','Ho Ho Ho!','\\uD83C\\uDF84'];
function drawSnowmanBubble(now){
  if (snowmanProg < 1){ bubble.start=-1; bubble.next=now+3000; return; }
  if (!bubble.next) bubble.next = now+3000;
  if (bubble.start<0 && now>=bubble.next){ bubble.start=now; bubble.text=BUBBLE_TEXTS[(Math.random()*BUBBLE_TEXTS.length)|0]; bubble.w=0; }
  if (bubble.start<0) return;
  var age=(now-bubble.start)/1000;
  if (age>2.5){ bubble.start=-1; bubble.next=now+10000+Math.random()*8000; return; }
  var a=snowmanAnchor(), fs=Math.max(11,a.s*0.42);
  ctx.save(); ctx.font='bold '+fs+'px sans-serif';
  if(!bubble.w) bubble.w=ctx.measureText(bubble.text).width;
  var pop=age<0.25?age/0.25:1, fade=age>2.1?1-(age-2.1)/0.4:1;
  var sc=0.6+0.4*(1-Math.pow(1-pop,3));
  var pw=bubble.w+fs*1.2, ph=fs*1.8;
  var bx=a.x+a.s*0.3, by=a.headY-a.s*0.4-ph;
  ctx.globalAlpha=Math.max(0,fade);
  ctx.translate(bx,by+ph); ctx.scale(sc,sc); ctx.translate(-bx,-(by+ph));
  ctx.fillStyle='rgba(0,0,0,0.12)'; fxRoundRect(ctx,bx-pw*0.15+2,by+2,pw,ph,ph*0.45); ctx.fill();
  ctx.fillStyle='#fff'; ctx.strokeStyle='rgba(120,140,170,0.6)'; ctx.lineWidth=1;
  fxRoundRect(ctx,bx-pw*0.15,by,pw,ph,ph*0.45); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx-pw*0.02,by+ph-1); ctx.lineTo(bx-a.s*0.15,by+ph+fs*0.7); ctx.lineTo(bx+pw*0.12,by+ph-1); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#c0283a'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(bubble.text, bx-pw*0.15+pw/2, by+ph/2+1);
  ctx.restore();
}
// 2. 极光颜色循环
function isPolarNight(){ return true; }
var AURORA_KEYS=[140,180,275,325,500], auroraHueSmooth=140, _auroraHueFrame=-1, _auroraHueVal=140;
function auroraHueNow(t){
  var ms=(typeof t==='number')?t:fxNow;
  var p=(ms%20000)/20000*4, i=Math.floor(p), f=p-i; f=f*f*(3-2*f);
  var h=AURORA_KEYS[i]+(AURORA_KEYS[i+1]-AURORA_KEYS[i])*f;
  if(!isPolarNight()) h=140;
  if(boost>0){ var tg=315+Math.floor(h/360)*360; if(tg-h>180) tg-=360; h=h+(tg-h)*Math.min(1,boost*1.2); }
  auroraHueSmooth+=(h-auroraHueSmooth)*0.08;
  return auroraHueSmooth%360;
}
function auroraColor(alpha,dh){
  if(_auroraHueFrame!==fxNow){ _auroraHueFrame=fxNow; _auroraHueVal=auroraHueNow(fxNow); }
  var h=(_auroraHueVal+(dh||0)+360)%360, s2=75+boost*15, l=58+boost*6;
  return 'hsla('+h.toFixed(1)+','+s2+'%,'+l+'%,'+alpha+')';
}
// 3. 玻璃雨滴
var rainDrops=[], rainNext=0;
function spawnRainDrop(now){
  if(rainDrops.length>=2||fxCount()>=FX_MAX_PARTICLES) return;
  var side=Math.random()<0.5?-1:1;
  rainDrops.push({ t0:now, dur:1500, rr:R*(0.80+Math.random()*0.14), th0:side*(0.35+Math.random()*0.6), dth:side*(0.55+Math.random()*0.35), len:R*(0.035+Math.random()*0.02) });
}
function drawRainDrops(now){
  if(!rainNext) rainNext=now+5000;
  if(now>=rainNext){ spawnRainDrop(now); if(Math.random()<0.4) spawnRainDrop(now); rainNext=now+5000+Math.random()*5000; }
  if(!rainDrops.length) return;
  ctx.save();
  for(var i=rainDrops.length-1;i>=0;i--){
    var d=rainDrops[i], p=(now-d.t0)/d.dur;
    if(p>=1){ rainDrops.splice(i,1); continue; }
    var e=p*p*(3-2*p), th=d.th0+d.dth*e;
    var x=CX+d.rr*Math.sin(th), y=CY-d.rr*Math.cos(th), ang=th+(d.dth>0?Math.PI/2:-Math.PI/2);
    var al=(p<0.15?p/0.15:1)*(p>0.75?(1-p)/0.25:1);
    var thT=d.th0+d.dth*Math.max(0,e-0.18);
    ctx.globalAlpha=al*0.35; ctx.strokeStyle='rgba(220,235,255,1)'; ctx.lineWidth=Math.max(1,R*0.004);
    ctx.beginPath(); ctx.arc(CX,CY,d.rr,thT-Math.PI/2,th-Math.PI/2,d.dth<0); ctx.stroke();
    ctx.globalAlpha=al*0.75;
    ctx.translate(x,y); ctx.rotate(ang);
    ctx.fillStyle='rgba(200,225,255,0.55)';
    ctx.beginPath(); ctx.ellipse(0,0,d.len,d.len*0.32,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.beginPath(); ctx.ellipse(d.len*0.35,-d.len*0.1,d.len*0.3,d.len*0.09,0,0,Math.PI*2); ctx.fill();
    ctx.setTransform(1,0,0,1,0,0);
  }
  ctx.restore();
}
// 4. 点击天使
var angelFx={t0:-1}, feathers=[];
function hitTestAngel(x,y){ var a=angelAnchor(),dx=x-a.x,dy=y-a.y; return dx*dx+dy*dy<=Math.pow(a.s*1.6,2); }
function triggerAngel(now){
  angelFx.t0=now; var a=angelAnchor(), n=3+((Math.random()*3)|0);
  for(var i=0;i<n&&fxCount()<FX_MAX_PARTICLES;i++){
    feathers.push({ x:a.x+(Math.random()-0.5)*a.s, y:a.y, vx:(Math.random()-0.5)*30, vy:12+Math.random()*14, rot:Math.random()*6.28, vr:(Math.random()-0.5)*3, ph:Math.random()*6.28, life:0, max:2.6+Math.random()*1.2, sz:a.s*(0.22+Math.random()*0.12) });
  }
}
function drawAngelFx(now){
  var a=angelAnchor();
  if(angelFx.t0>=0){
    var p=(now-angelFx.t0)/700;
    if(p>=1) angelFx.t0=-1;
    else{
      ctx.save(); ctx.globalCompositeOperation='lighter';
      var g=ctx.createRadialGradient(a.x,a.y,0,a.x,a.y,a.s*2.2);
      g.addColorStop(0,'rgba(255,240,170,'+(0.8*(1-p))+')'); g.addColorStop(1,'rgba(255,220,120,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(a.x,a.y,a.s*2.2,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(255,225,130,'+(0.9*(1-p))+')'; ctx.lineWidth=Math.max(1.5,a.s*0.12*(1-p));
      ctx.beginPath(); ctx.ellipse(a.x,a.y-a.s*0.9,a.s*(0.5+p*1.4),a.s*(0.16+p*0.45),0,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }
  if(!feathers.length) return;
  ctx.save();
  for(var i=feathers.length-1;i>=0;i--){
    var f=feathers[i]; f.life+=fxDt;
    if(f.life>=f.max||f.y>H*0.875){ feathers.splice(i,1); continue; }
    f.ph+=fxDt*2.5; f.x+=(f.vx+Math.sin(f.ph)*18)*fxDt; f.y+=f.vy*fxDt; f.vx*=0.98; f.rot+=f.vr*fxDt+Math.sin(f.ph)*0.02;
    ctx.globalAlpha=Math.min(1,(f.max-f.life)/0.8);
    ctx.translate(f.x,f.y); ctx.rotate(f.rot);
    ctx.fillStyle='#f3cf5a'; ctx.beginPath(); ctx.ellipse(0,0,f.sz,f.sz*0.32,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(160,110,20,0.7)'; ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.moveTo(-f.sz*1.15,0); ctx.lineTo(f.sz*0.9,0); ctx.stroke();
    ctx.rotate(-f.rot); ctx.translate(-f.x,-f.y);
  }
  ctx.restore();
}
// 5. 雪人周围脚印（离屏缓存）
var smFootLayer=null, smFootKey='';
function buildSnowmanFootprints(a){
  var n=5, pad=a.s*2, c=document.createElement('canvas');
  c.width=Math.ceil(pad*2); c.height=Math.ceil(pad);
  var g=c.getContext('2d'), cx2=pad, cy=pad*0.5, rx=a.s*1.25, ry=a.s*0.32;
  for(var i=0;i<n;i++){
    var ang=Math.PI*0.15+i/n*Math.PI*2+(i%2)*0.12;
    var x=cx2+Math.cos(ang)*rx, y=cy+Math.sin(ang)*ry, dir=ang+Math.PI/2, fw=a.s*0.09, fh=a.s*0.15;
    g.save(); g.translate(x,y); g.rotate(dir); g.scale(1,0.45);
    g.fillStyle='rgba(90,110,150,0.22)';
    g.beginPath(); g.ellipse(-fw*0.8,0,fw,fh,0,0,Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(fw*0.8,fh*0.6,fw,fh,0,0,Math.PI*2); g.fill();
    g.fillStyle='rgba(255,255,255,0.35)';
    g.beginPath(); g.ellipse(-fw*0.8,-fh*0.3,fw*0.6,fh*0.35,0,0,Math.PI*2); g.fill();
    g.restore();
  }
  return { cv:c, ox:pad, oy:pad*0.5 };
}





// ===== v19 公共（彩带/落雪/鼠标雪迹/麋鹿/祝福语/倒计时）=====
function treeGeom(){ var bY=H*0.875, tH=H*0.60; return { bY:bY, tH:tH, topY:bY-tH*0.98 }; }
function treeHalfWx(g,s){ return g.tH*(0.06+0.36*s); }

    { phase:Math.PI, base:'rgba(190,28,40,0.92)', hi:'rgba(255,150,150,0.85)', spark:'#ffe0e0' }
  ];
  tl.save(); tl.lineCap='round';

    var bd=bands[b], prev=null;
    for(var i=0;i<=steps;i++){

      var depth=Math.cos(a);

      var y=g.topY+sc*(g.bY-g.topY)+depth*hw*0.10;
      if(prev && prev.d>-0.05 && depth>-0.05){
        var vis=Math.min(1,(Math.min(prev.d,depth)+0.05)*2.2);
        var w=1.2+sc*1.8;
        tl.globalAlpha=0.85*vis; tl.strokeStyle=bd.base; tl.lineWidth=w;
        tl.beginPath(); tl.moveTo(prev.x,prev.y); tl.lineTo(x,y); tl.stroke();
        var lit=0.35+0.65*Math.max(0,-Math.sin(a)*0.6+depth*0.6);
        tl.globalAlpha=vis*lit; tl.strokeStyle=bd.hi; tl.lineWidth=w*0.38;
        tl.beginPath(); tl.moveTo(prev.x,prev.y-w*0.25); tl.lineTo(x,y-w*0.25); tl.stroke();

      }
      prev={ x:x, y:y, d:depth };

}

  function getFrostOpacity(){
    var dayDim=1-0.22*skyState.duskMix-0.30*skyState.dawnMix;
    return Math.max(0.12, Math.min(1, (0.28+0.72*fogLevel)*dayDim));

  function drawFrostBranch(c, x, y, ang, len, depth, lw, frnd){
    if(depth<=0 || len<2.5) return;
    var ex=x+Math.cos(ang)*len, ey=y+Math.sin(ang)*len;
    var mx=(x+ex)*0.5+Math.cos(ang+1.57)*len*0.06*(frnd()-0.5);
    var my=(y+ey)*0.5+Math.sin(ang+1.57)*len*0.06*(frnd()-0.5);
    c.beginPath(); c.moveTo(x,y); c.quadraticCurveTo(mx,my,ex,ey);
    c.lineWidth=lw*2.1; c.strokeStyle='rgba(218,236,255,0.09)'; c.stroke();
    c.lineWidth=lw; c.strokeStyle='rgba(242,249,255,0.28)'; c.stroke();
    var twigs=depth>=3? 4 : 3;
    for(var i=1;i<=twigs;i++){
      var u=0.26+0.64*(i/twigs);
      var bx=x+(ex-x)*u, by=y+(ey-y)*u;
      var sLen=len*(0.46-u*0.16)*(0.82+frnd()*0.34);
      var spread=0.78+frnd()*0.26;
      drawFrostBranch(c, bx, by, ang-spread, sLen, depth-1, lw*0.72, frnd);
      drawFrostBranch(c, bx, by, ang+spread, sLen, depth-1, lw*0.72, frnd);
    }
    if(depth>=2){
      drawFrostBranch(c, ex, ey, ang+(frnd()-0.5)*0.22, len*0.52, depth-1, lw*0.74, frnd);
    }
  }
  function buildFrostLayer(){
    frctx.clearRect(0,0,W,H);
    frctx.save();
    frctx.beginPath(); frctx.arc(CX,CY,R,0,6.2832); frctx.clip();
    var fseed=409;
    function frnd(){ fseed=(fseed*9301+49297)%233280; return fseed/233280; }
    var sc=Math.max(0.6, W/400);
    // 左下与右上边缘淡淡的雾霜基底晕染
    var patches=[
      {a:Math.PI*0.74, rr:0.98, rad:R*0.36, op:0.11},
      {a:-Math.PI*0.24, rr:0.98, rad:R*0.34, op:0.10},
      {a:Math.PI*0.86, rr:0.98, rad:R*0.24, op:0.07},
      {a:-Math.PI*0.12, rr:0.98, rad:R*0.22, op:0.07}
    ];
    for(var pi=0;pi<patches.length;pi++){
      var pt=patches[pi], px=CX+Math.cos(pt.a)*R*pt.rr, py=CY+Math.sin(pt.a)*R*pt.rr;
      var fg=frctx.createRadialGradient(px,py,pt.rad*0.05,px,py,pt.rad);
      fg.addColorStop(0,'rgba(226,242,255,'+pt.op+')');
      fg.addColorStop(0.55,'rgba(210,232,252,'+(pt.op*0.42).toFixed(3)+')');
      fg.addColorStop(1,'rgba(210,232,252,0)');
      frctx.fillStyle=fg;
      frctx.beginPath(); frctx.arc(px,py,pt.rad,0,6.2832); frctx.fill();
    }
    frctx.lineCap='round';
    // 霜花簇：重点分布于左下 (0.56π~0.94π) 与右上 (-0.42π~-0.06π)
    var clusters=[
      {a:Math.PI*0.64, len:0.145, dep:3}, {a:Math.PI*0.71, len:0.185, dep:3},
      {a:Math.PI*0.78, len:0.165, dep:3}, {a:Math.PI*0.85, len:0.135, dep:2},
      {a:Math.PI*0.91, len:0.105, dep:2},
      {a:-Math.PI*0.36, len:0.130, dep:2}, {a:-Math.PI*0.28, len:0.180, dep:3},
      {a:-Math.PI*0.21, len:0.160, dep:3}, {a:-Math.PI*0.14, len:0.125, dep:2},
      {a:-Math.PI*0.08, len:0.095, dep:2},
      {a:Math.PI*1.12, len:0.085, dep:2}, {a:Math.PI*0.36, len:0.085, dep:2}
    ];
    for(var ci=0;ci<clusters.length;ci++){
      var cl=clusters[ci];
      var sx=CX+Math.cos(cl.a)*R*0.995, sy=CY+Math.sin(cl.a)*R*0.995;
      var inAng=cl.a+Math.PI+(frnd()-0.5)*0.34;
      drawFrostBranch(frctx, sx, sy, inAng, R*cl.len*(0.92+frnd()*0.16), cl.dep, 0.95*sc, frnd);
    }
    frctx.restore();
  }
  function drawGlassLayer(){
    gctx.clearRect(0,0,W,H);
    gctx.save();
    gctx.beginPath(); gctx.arc(CX,CY,R,0,6.2832); gctx.clip();
    // 静态离屏霜花层叠加（透明度随 fogLevel 与昼夜微调）
    if(frostLayer.width>0){
      var fop=getFrostOpacity();
      lastFrostOp=fop;
      gctx.save();
      gctx.globalAlpha=fop;
      gctx.drawImage(frostLayer,0,0);
      gctx.restore();
    }
    // 内壁淡蓝折射高光环（Fresnel 菲涅尔内壁折射感）
    var ir=gctx.createRadialGradient(CX,CY,R*0.76,CX,CY,R);
    ir.addColorStop(0,'rgba(176,214,250,0)');
    ir.addColorStop(0.58,'rgba(176,214,250,0.06)');
    ir.addColorStop(0.86,'rgba(202,230,255,0.20)');
    ir.addColorStop(0.96,'rgba(225,242,255,0.26)');
    ir.addColorStop(1.00,'rgba(148,196,245,0.08)');
    gctx.fillStyle=ir;
    gctx.fillRect(0,0,W,H);
    // 左上来光方向环境反射亮弧
    var arcR=R-Math.max(3,W*0.011);
    var hiG=gctx.createLinearGradient(CX-R*0.88,CY-R*0.88,CX+R*0.20,CY+R*0.20);
    hiG.addColorStop(0,'rgba(235,247,255,0.42)');
    hiG.addColorStop(0.45,'rgba(196,226,255,0.22)');
    hiG.addColorStop(1,'rgba(196,226,255,0)');
    gctx.lineCap='round';
    gctx.strokeStyle=hiG;
    gctx.lineWidth=Math.max(4,W*0.022);
    gctx.beginPath(); gctx.arc(CX,CY,arcR,Math.PI*0.92,Math.PI*1.58); gctx.stroke();
    gctx.strokeStyle='rgba(255,255,255,0.34)';
    gctx.lineWidth=Math.max(1.2,W*0.005);
    gctx.beginPath(); gctx.arc(CX,CY,R-Math.max(1.8,W*0.006),Math.PI*1.00,Math.PI*1.50); gctx.stroke();
    // 右下暗弧（玻璃球厚度与环境背光暗边）
    var dkG=gctx.createLinearGradient(CX-R*0.15,CY-R*0.15,CX+R*0.90,CY+R*0.90);
    dkG.addColorStop(0,'rgba(8,16,30,0)');
    dkG.addColorStop(0.55,'rgba(10,18,32,0.28)');
    dkG.addColorStop(1,'rgba(6,12,24,0.44)');
    gctx.strokeStyle=dkG;
    gctx.lineWidth=Math.max(5,W*0.028);
    gctx.beginPath(); gctx.arc(CX,CY,R-Math.max(2.5,W*0.009),-0.06*Math.PI,0.56*Math.PI); gctx.stroke();
    // 右下内壁淡蓝二次折射高光弧
    var caG=gctx.createLinearGradient(CX,CY+R*0.4,CX+R*0.85,CY+R*0.85);
    caG.addColorStop(0,'rgba(182,222,255,0)');
    caG.addColorStop(0.5,'rgba(198,232,255,0.22)');
    caG.addColorStop(1,'rgba(182,222,255,0)');
    gctx.strokeStyle=caG;
    gctx.lineWidth=Math.max(2,W*0.010);
    gctx.beginPath(); gctx.arc(CX,CY,R*0.93,0.12*Math.PI,0.44*Math.PI); gctx.stroke();
    gctx.restore();
  }

  function buildDistantMountains(){
    mlctx.clearRect(0,0,W,H);
    mlctx.save();
    var ridges=[
      {
        pts:[[-0.06,0.84],[0.02,0.83],[0.13,0.68],[0.24,0.74],[0.35,0.61],[0.46,0.70],[0.56,0.63],[0.69,0.73],[0.81,0.62],[0.92,0.71],[1.06,0.83]],
        topCol:'rgba(34,54,84,0.56)', botCol:'rgba(16,26,40,0.18)', rimCol:'rgba(182,210,245,0.11)', baseY:0.89
      },
      {
        pts:[[-0.06,0.87],[0.00,0.86],[0.10,0.74],[0.21,0.79],[0.31,0.69],[0.44,0.77],[0.58,0.71],[0.71,0.78],[0.84,0.69],[0.95,0.77],[1.06,0.86]],
        topCol:'rgba(24,40,64,0.62)', botCol:'rgba(16,26,40,0.22)', rimCol:'rgba(168,198,236,0.10)', baseY:0.90
      }
    ];
    for(var ri=0;ri<ridges.length;ri++){
      var rg=ridges[ri], pts=rg.pts;
      var grd=mlctx.createLinearGradient(0,H*0.60,0,H*rg.baseY);
      grd.addColorStop(0,rg.topCol);
      grd.addColorStop(0.65,rg.topCol);
      grd.addColorStop(1,rg.botCol);
      mlctx.fillStyle=grd;
      mlctx.beginPath();
      mlctx.moveTo(pts[0][0]*W, H*rg.baseY);
      for(var pi=0;pi<pts.length;pi++){
        mlctx.lineTo(pts[pi][0]*W, pts[pi][1]*H);
      }
      mlctx.lineTo(pts[pts.length-1][0]*W, H*rg.baseY);
      mlctx.closePath();
      mlctx.fill();
      mlctx.strokeStyle=rg.rimCol;
      mlctx.lineWidth=Math.max(1.2, W*0.005);
      mlctx.beginPath();
      for(var pj=0;pj<pts.length;pj++){
        if(pj===0) mlctx.moveTo(pts[pj][0]*W, pts[pj][1]*H);
        else mlctx.lineTo(pts[pj][0]*W, pts[pj][1]*H);
      }
      mlctx.stroke();
    }
    // 静态离屏多级缩小放大实现镜头景深(DOF)模糊，避免每帧 filter
    mbaCtx.clearRect(0,0,mountainBlurA.width,mountainBlurA.height);

    mbbCtx.clearRect(0,0,mountainBlurB.width,mountainBlurB.height);

    mlctx.clearRect(0,0,W,H);
    mlctx.imageSmoothingEnabled=true;
    mlctx.globalAlpha=0.82;
    mlctx.drawImage(mountainBlurB,0,0,W,H);
    mlctx.globalAlpha=0.26;
    mlctx.drawImage(mountainBlurA,0,0,W,H);
    mlctx.globalAlpha=1;
    var mist=mlctx.createLinearGradient(0,H*0.72,0,H*0.90);
    mist.addColorStop(0,'rgba(24,40,64,0)');
    mist.addColorStop(0.55,'rgba(22,38,62,0.24)');
    mist.addColorStop(1,'rgba(16,26,40,0)');
    mlctx.fillStyle=mist;
    mlctx.fillRect(0,H*0.72,W,H*0.20);
    // 水平边缘柔化，避免缩放至 0.85 或倾斜时出现切边
    mlctx.globalCompositeOperation='destination-in';
    var edgeF=mlctx.createLinearGradient(0,0,W,0);
    edgeF.addColorStop(0,'rgba(255,255,255,0)');
    edgeF.addColorStop(0.12,'rgba(255,255,255,1)');
    edgeF.addColorStop(0.88,'rgba(255,255,255,1)');
    edgeF.addColorStop(1,'rgba(255,255,255,0)');
    mlctx.fillStyle=edgeF;
    mlctx.fillRect(0,0,W,H);
    mlctx.restore();
  }

  function buildSnowmanAo(){
    var s=H*0.60*0.095, r1=s*0.36;
    var gw=Math.max(8, Math.ceil(s*1.4)), gh=Math.max(6, Math.ceil(s*0.42));
    var bw=Math.max(8, Math.ceil(r1*2.4)), bh=Math.max(8, Math.ceil(r1*2.4));
    snowmanAoLayer.width=gw; snowmanAoLayer.height=gh;
    snowmanBodyAoLayer.width=bw; snowmanBodyAoLayer.height=bh;
    snowmanAoSpec={s:s, gw:gw, gh:gh, bw:bw, bh:bh};
    // 1) 雪人底部接地 AO（离屏缓存，避免每帧重算渐变）
    smAoCtx.clearRect(0,0,gw,gh);
    smAoCtx.save();
    smAoCtx.translate(gw*0.5, gh*0.5);
    var rx=s*0.56, ry=s*0.145;
    smAoCtx.scale(1, ry/rx);
    var gAo=smAoCtx.createRadialGradient(0,0,rx*0.08,0,0,rx);
    gAo.addColorStop(0,'rgba(10,18,32,0.52)');
    gAo.addColorStop(0.45,'rgba(12,22,38,0.30)');
    gAo.addColorStop(1,'rgba(16,26,40,0)');
    smAoCtx.fillStyle=gAo;
    smAoCtx.beginPath(); smAoCtx.arc(0,0,rx,0,6.2832); smAoCtx.fill();
    smAoCtx.restore();
    // 2) 雪人下雪球底部柔和自遮蔽暗部（离屏缓存）
    smBodyAoCtx.clearRect(0,0,bw,bh);
    smBodyAoCtx.save();
    smBodyAoCtx.translate(bw*0.5, bh*0.5);
    smBodyAoCtx.beginPath(); smBodyAoCtx.arc(0,0,r1,0,6.2832); smBodyAoCtx.clip();
    var bAo=smBodyAoCtx.createLinearGradient(0, r1*0.20, 0, r1);
    bAo.addColorStop(0,'rgba(12,22,38,0)');
    bAo.addColorStop(0.55,'rgba(12,22,38,0.16)');
    bAo.addColorStop(1,'rgba(8,16,30,0.40)');
    smBodyAoCtx.fillStyle=bAo;
    smBodyAoCtx.fillRect(-r1,-r1,r1*2,r1*2);
    smBodyAoCtx.restore();
  }

  function buildSnowSpeckles(){
    stctx.clearRect(0,0,W,H);
    stctx.save();
    stctx.beginPath();
    stctx.ellipse(CX, H*0.882, W*0.415, H*0.092, 0, 0, 6.2832);
    stctx.clip();
    var s=97;
    function srnd(){ s=(s*9301+49297)%233280; return s/233280; }
    var sc=Math.max(0.6, W/400);
    // 轻微雪坡纹理起伏斑块
    for(var i=0;i<26;i++){
      var bx=CX+(srnd()-0.5)*W*0.78;
      var by=H*0.82+srnd()*H*0.14;
      var brx=(8+srnd()*18)*sc, bry=(2+srnd()*4.5)*sc;
      stctx.fillStyle=(i%2===0)?'rgba(194,207,224,0.08)':'rgba(16,26,40,0.07)';
      stctx.beginPath(); stctx.ellipse(bx,by,brx,bry,0,0,6.2832); stctx.fill();
    }
    // 细噪声斑点（亮雪晶 + 暗微粒）
    var count=Math.min(420, Math.max(200, Math.round(W*0.95)));
    for(var k=0;k<count;k++){
      var sx=CX+(srnd()-0.5)*W*0.80;
      var sy=H*0.805+srnd()*H*0.16;
      var r=(0.55+srnd()*1.15)*sc;
      var isBright=(srnd()>0.46);
      stctx.fillStyle=isBright
        ? ('rgba(214,230,251,'+(0.06+srnd()*0.11).toFixed(3)+')')
        : ('rgba(58,76,100,'+(0.06+srnd()*0.10).toFixed(3)+')');
      stctx.beginPath(); stctx.arc(sx,sy,r,0,6.2832); stctx.fill();
    }
    stctx.restore();
  }

  function drawTree(){

      {x:cx-treeH*0.13, y:baseY+treeH*0.025, w:treeH*0.17, h:treeH*0.115, c1:'#c9a227', c2:'#8c1c1c'},
      {x:cx+treeH*0.18, y:baseY+treeH*0.005, w:treeH*0.13, h:treeH*0.095, c1:'#274b8f', c2:'#e8e8e8'},
      {x:cx+treeH*0.03, y:baseY-treeH*0.05, w:treeH*0.10, h:treeH*0.075, c1:'#7a1f2b', c2:'#e8c15a'},
      {x:cx-treeH*0.23, y:baseY+treeH*0.045, w:treeH*0.12, h:treeH*0.085, c1:'#1f6b4a', c2:'#ffd75e'},
      {x:cx+treeH*0.31, y:baseY+treeH*0.03, w:treeH*0.11, h:treeH*0.08, c1:'#8e44ad', c2:'#f5f5f5'},
      {x:cx-treeH*0.02, y:baseY+treeH*0.055, w:treeH*0.15, h:treeH*0.10, c1:'#b03a2e', c2:'#f7dc6f'},
      {x:cx+treeH*0.11, y:baseY+treeH*0.05, w:treeH*0.09, h:treeH*0.07, c1:'#16a085', c2:'#ffd75e'}
    ];
    while(giftStates.length<giftSpecs.length) giftStates.push({target:0, prog:0});
    // 浓密锥体 + 挂雪（缓存到 treeLayer）
    var tiers=6;
    for(var L=tiers-1;L>=0;L--){
      var t=L/(tiers-1);
      var topY=baseY-treeH*0.10-(1-t)*treeH*0.80-treeH*0.22;
      var halfW=treeH*0.13+t*treeH*0.31;
      var lh=treeH*0.36;

        tlctx.save();
        tlctx.globalCompositeOperation='source-atop';
        var aoCy=topY+lh*0.95, aoRx=halfW*0.98, aoRy=lh*0.24;
        tlctx.translate(cx, aoCy);
        tlctx.scale(1, aoRy/aoRx);
        var tierAo=tlctx.createRadialGradient(0,0,aoRx*0.10,0,0,aoRx);
        tierAo.addColorStop(0,'rgba(8,14,26,0.44)');
        tierAo.addColorStop(0.58,'rgba(10,18,32,0.22)');
        tierAo.addColorStop(1,'rgba(12,22,36,0)');
        tlctx.fillStyle=tierAo;
        tlctx.beginPath(); tlctx.arc(0,0,aoRx,0,6.2832); tlctx.fill();

      drawSolidTier(cx,topY,halfW,lh,L);
    }
    // 外伸下垂枝
    var tiers2=6;
    for(var L2=0;L2<tiers2;L2++){
      var t2=L2/(tiers2-1);
      var y2=baseY-treeH*0.06-(1-t2)*treeH*0.84;
      var spread=treeH*0.12+t2*treeH*0.34;
      var nB=2+Math.round(t2*3);
      for(var s=-1;s<=1;s+=2){
        for(var b=0;b<nB;b++){
          var fr=(b+0.7)/nB;
          var ang=s*(0.7+0.5*fr)+(rnd()-0.5)*0.2;
          var len=spread*(0.35+0.35*fr)*(0.8+rnd()*0.4);
          var droop=(0.25+0.5*t2)*len*0.5;
          drawBranch(cx+s*spread*0.55, y2+treeH*0.05, ang*0.5, len, droop, t2);
        }
      }
    }
    // 灯串位置（闪烁在 tick 画）
    lamps.length=0;
    for(var i2=0;i2<52;i2++){
      var u=rnd();
      var yy=baseY-treeH*0.06-u*treeH*0.86;
      var halfW2=(treeH*0.36*(1-u)+treeH*0.06)*0.85;
      var xx=cx+(rnd()-0.5)*2*halfW2;
      lamps.push({x:xx,y:yy,u:u,r:1.5+rnd()*1.3, sp:2+rnd()*4, ph:rnd()*6.28, ci:(rnd()*5)|0});

    try{ drawCandyCanes(tctx); drawIcicles(tctx); drawTinsel(tctx); }catch(e){}

    angel(cx, baseY-treeH*0.98, treeH*0.085);
    renderTreeScene(shakeActive? Math.max(0, performance.now()-shakeStart) : 0, 0);

  function applyTreeSway(targetCtx, ang){
    if(!ang) return;

    targetCtx.rotate(ang);
    targetCtx.translate(-W/2, -H*0.875);

  function renderTreeScene(shakeElapsed, treeSwayAng){
    tctx.clearRect(0,0,W,H);
    var cx=W/2, baseY=H*0.875, treeH=H*0.60;
    var g0=tctx.createRadialGradient(cx,baseY-treeH*0.45,6,cx,baseY-treeH*0.45,treeH*0.92);
    g0.addColorStop(0, rgbStr(skyState.glowCol, (0.20+0.06*skyState.duskMix+0.04*skyState.dawnMix).toFixed(3)));
    g0.addColorStop(0.5, rgbStr(skyState.cloudCol, 0.09));
    g0.addColorStop(1,'rgba(16,26,40,0)');
    tctx.fillStyle=g0; tctx.fillRect(0,0,W,H);
    tctx.drawImage(snowTexLayer,0,0);
    var ex=Math.max(0,(accum-0.35)/0.65);

    tctx.save();
    tctx.beginPath();
    tctx.ellipse(cx, H*(0.89-ex*0.011), W*(0.40+ex*0.03), H*(0.075+ex*0.022), 0, 0, 6.2832);
    tctx.clip();
    tctx.save();
    tctx.translate(0, baseY+treeH*0.015);
    tctx.scale(1, -0.18);
    tctx.translate(0, -baseY);
    tctx.globalAlpha=0.042;
    tctx.drawImage(treeLayer, -2, 0);
    tctx.drawImage(treeLayer, 2, 0);
    tctx.restore();
    var refFade=tctx.createLinearGradient(0, baseY-treeH*0.02, 0, H*0.98);
    refFade.addColorStop(0, rgbStr(skyState.skMid, 0));
    refFade.addColorStop(1, rgbStr(skyState.skBot, 0.52));
    tctx.fillStyle=refFade;
    tctx.fillRect(cx-W*0.45, baseY-treeH*0.03, W*0.90, H*0.18);
    tctx.restore();
    var wob=0, p=0;
    if(shakeElapsed>0 && shakeElapsed<500){
      p=shakeElapsed/500;
      wob=(1-p)*(1-p);
    }
    for(var hi=0;hi<houseSpecs.length;hi++){
      var hs=houseSpecs[hi];
      house(hs.x, hs.y, hs.s, wob, hi, p);
    }
    if(lampSpec){
      drawStreetLampPost(lampSpec.x, lampSpec.y, lampSpec.h, wob, p);
    }
    // 毛绒树裙（随昼夜主题平滑过渡色调，厚度/半径随 accum 微调）
    var rx=treeH*(0.44+0.045*ex), ry=treeH*(0.075+0.028*ex), sy=baseY+treeH*(0.015-0.008*ex);
    var skGrd=tctx.createLinearGradient(0,sy-ry,0,sy+ry);
    skGrd.addColorStop(0, rgbStr(skyState.skTop));
    skGrd.addColorStop(0.55, rgbStr(skyState.skMid));
    skGrd.addColorStop(1, rgbStr(skyState.skBot));
    tctx.fillStyle=skGrd;
    tctx.beginPath(); tctx.ellipse(cx,sy,rx,ry,0,0,6.2832); tctx.fill();
    if(ex>0.05){
      var skTop=tctx.createLinearGradient(0,sy-ry*0.90,0,sy+ry*0.54);
      skTop.addColorStop(0, rgbStr(skyState.gf0, (0.38+0.34*ex).toFixed(3)));
      skTop.addColorStop(1, rgbStr(skyState.skMid, (0.18+0.20*ex).toFixed(3)));
      tctx.fillStyle=skTop;
      tctx.beginPath(); tctx.ellipse(cx,sy-ry*0.18,rx*0.86,ry*0.72,0,0,6.2832); tctx.fill();
    }
    var puffTop=rgbStr(skyState.skTop, 0.92), puffBot=rgbStr(skyState.skBot, 0.90);
    for(var i=0;i<skirtPuffs.length;i++){
      var sp=skirtPuffs[i], pyNorm=Math.sin(sp.a);
      tctx.fillStyle=pyNorm<0 ? puffTop : puffBot;
      tctx.beginPath();
      tctx.arc(cx+rx*Math.cos(sp.a), sy+ry*pyNorm, sp.r*(1+0.42*ex),0,6.2832);
      tctx.fill();
    }
    // 树冠最底层投射在树裙上的接地环境光遮蔽(AO)
    var trAoRx=treeH*0.40, trAoRy=treeH*0.072;
    tctx.save();
    tctx.translate(cx, baseY-treeH*0.015);
    tctx.scale(1, trAoRy/trAoRx);
    var trAoG=tctx.createRadialGradient(0,0,trAoRx*0.12,0,0,trAoRx);
    trAoG.addColorStop(0,'rgba(8,14,26,0.36)');
    trAoG.addColorStop(0.55,'rgba(12,20,34,0.16)');
    trAoG.addColorStop(1,'rgba(16,26,40,0)');
    tctx.fillStyle=trAoG;
    tctx.beginPath(); tctx.arc(0,0,trAoRx,0,6.2832); tctx.fill();
    tctx.restore();
    // 礼物堆 8 盒
    for(var gi=0;gi<giftSpecs.length;gi++){
      var gs=giftSpecs[gi];
      var op=giftStates[gi]? giftStates[gi].prog : 0;
      gift(gs.x, gs.y, gs.w, gs.h, gs.c1, gs.c2, wob, gi, p, op);
    }
    if(treeSwayAng){
      tctx.save();
      applyTreeSway(tctx, treeSwayAng);
      tctx.drawImage(treeLayer,0,0);
      tctx.restore();
    } else {
      tctx.drawImage(treeLayer,0,0);
    }
    if(skyState.treeTintA>0.004){
      tctx.save();
      tctx.globalCompositeOperation='source-atop';
      tctx.fillStyle=rgbStr(skyState.treeTint, skyState.treeTintA.toFixed(3));
      tctx.fillRect(0,0,W,H);
      tctx.restore();
    }
  }
  function drawSolidTier(cx,topY,halfW,lh,seedv){
    var teeth=18, i, tt, x, y, jag;
    tlctx.beginPath(); tlctx.moveTo(cx,topY);
    for(i=0;i<=teeth;i++){ tt=i/teeth;
      x=cx+halfW*tt*(0.66+0.34*Math.sin(tt*2.4+seedv*1.3));
      y=topY+lh*tt; jag=(i%2)? lh*0.06:0;
      tlctx.lineTo(x+jag*0.2,y+jag);
      if(i<teeth) tlctx.lineTo(cx+halfW*tt*0.84, y+lh*0.04);
    }
    tlctx.lineTo(cx,topY+lh*0.94);
    for(i=teeth;i>=0;i--){ tt=i/teeth;
      x=cx-halfW*tt*(0.66+0.34*Math.sin(tt*2.4+seedv*1.3+0.8));
      y=topY+lh*tt; jag=(i%2)? lh*0.06:0;
      tlctx.lineTo(x-jag*0.2,y+jag);
      if(i>0) tlctx.lineTo(cx-halfW*tt*0.84, y+lh*0.04);
    }
    tlctx.closePath();
    var g=tlctx.createLinearGradient(0,topY,0,topY+lh);
    g.addColorStop(0,'rgb('+(96+seedv*4)+','+(136+seedv*4)+','+(128+seedv*4)+')');
    g.addColorStop(0.52,'rgb('+(58+seedv*3)+','+(96+seedv*4)+','+(88+seedv*3)+')');
    g.addColorStop(1,'rgb('+(26+seedv*2)+','+(52+seedv*3)+','+(54+seedv*2)+')');
    tlctx.fillStyle=g; tlctx.fill();
    // 淡蓝轮廓光（模拟极夜边缘光 0x88aae0）
    tlctx.strokeStyle='rgba(136,170,224,0.36)';
    tlctx.lineWidth=1.1;
    tlctx.stroke();
    tlctx.save(); tlctx.clip();
    // 底部极夜压暗 + 顶部冷蓝高光 + 树冠层底柔和 AO
    var shadeG=tlctx.createLinearGradient(0,topY,0,topY+lh);
    shadeG.addColorStop(0,'rgba(212,226,245,0.16)');
    shadeG.addColorStop(0.32,'rgba(212,226,245,0)');
    shadeG.addColorStop(0.68,'rgba(16,26,40,0)');
    shadeG.addColorStop(1,'rgba(8,14,26,0.48)');
    tlctx.fillStyle=shadeG;
    tlctx.fillRect(cx-halfW*1.1,topY,halfW*2.2,lh);
    tlctx.save();
    tlctx.translate(cx, topY+lh*0.95);
    tlctx.scale(1, (lh*0.22)/(halfW*0.85));
    var botAo=tlctx.createRadialGradient(0,0,halfW*0.08,0,0,halfW*0.85);
    botAo.addColorStop(0,'rgba(8,14,24,0.34)');
    botAo.addColorStop(1,'rgba(8,14,24,0)');
    tlctx.fillStyle=botAo;
    tlctx.beginPath(); tlctx.arc(0,0,halfW*0.85,0,6.2832); tlctx.fill();
    tlctx.restore();
    for(var k=0;k<50;k++){
      var rx=cx+(Math.random()-0.5)*halfW*1.7, ry=topY+Math.random()*lh;
      tlctx.fillStyle=Math.random()>0.5?'rgba(212,226,245,0.07)':'rgba(16,26,40,0.18)';
      tlctx.beginPath(); tlctx.arc(rx,ry,Math.random()*lh*0.08+1.5,0,6.2832); tlctx.fill();
    }
    // 挂雪：冷蓝灰渐变 0xc2cfe0(顶亮) → 0x77899f(底暗)，保留厚度随 accum
    var th=lh*(0.07+0.17*accum);
    var snowG=tlctx.createLinearGradient(0,topY,0,topY+lh*0.32+th);
    snowG.addColorStop(0,'rgba(212,226,245,0.96)');
    snowG.addColorStop(0.35,'rgba(194,207,224,0.95)');
    snowG.addColorStop(1,'rgba(119,137,159,0.94)');
    tlctx.fillStyle=snowG;
    tlctx.beginPath();
    for(i=0;i<=teeth;i++){ tt=i/teeth; x=cx+halfW*tt*0.88*(i%2?0.95:1); y=topY+lh*tt*0.28+(i%2?2:0); if(i===0)tlctx.moveTo(x,y); else tlctx.lineTo(x,y); }
    for(i=teeth;i>=0;i--){ tt=i/teeth; x=cx+halfW*tt*0.88*(i%2?0.95:1); y=topY+lh*tt*0.28+(i%2?2:0)+th*(0.7+0.6*Math.sin(tt*7+seedv)); tlctx.lineTo(x,y); }
    tlctx.closePath(); tlctx.fill();
    var nClump=3+Math.round(accum*7);
    tlctx.fillStyle='rgba(154,172,196,0.92)';
    for(i=0;i<nClump;i++){ var sx2=cx+(Math.random()-0.5)*halfW*1.5, sy2=topY+lh*0.28*Math.min(1,Math.abs(sx2-cx)/halfW)+th;
      tlctx.beginPath(); tlctx.arc(sx2,sy2,(1.5+Math.random()*2.5)*(0.7+accum*0.7),0,6.2832); tlctx.fill(); }
    tlctx.restore();
  }
  function drawBranch(x,y,ang,len,droop,t){
    var dx=Math.sin(ang), dy=0.28+0.22*t;
    var ex=x+dx*len, ey=y+dy*len*0.55+droop;
    tlctx.strokeStyle='rgba(54,78,72,0.88)'; tlctx.lineWidth=1.5;
    tlctx.beginPath(); tlctx.moveTo(x,y); tlctx.quadraticCurveTo(x+dx*len*0.5, y+dy*len*0.3, ex,ey); tlctx.stroke();
    var n=9;
    for(var i=0;i<n;i++){
      var tt=i/n;
      var px=x+dx*len*tt, py=y+(dy*len*0.55+droop)*(tt*tt*0.7+tt*0.3);
      var nl=len*0.17*(1-tt*0.45);
      var side=(dx>=0?1:-1);
      var c=rnd();
      tlctx.strokeStyle = c>0.62? 'rgba(134,166,164,0.9)' : (c>0.3? 'rgba(84,118,110,0.92)' : 'rgba(46,74,68,0.92)');
      tlctx.lineWidth=1.1;
      tlctx.beginPath();
      tlctx.moveTo(px,py); tlctx.lineTo(px+side*nl*0.7, py+nl*0.45);
      tlctx.moveTo(px,py); tlctx.lineTo(px-side*nl*0.45, py+nl*0.5);
      tlctx.moveTo(px,py); tlctx.lineTo(px+side*nl*0.2, py-nl*0.35);
      tlctx.stroke();
    }
    // 枝上挂雪：冷蓝灰渐变（顶部亮 #c2cfe0 → 底部偏暗 #77899f）
    var brSnow=tlctx.createLinearGradient(x,y-2,ex,ey+1.5);
    brSnow.addColorStop(0,'rgba(194,207,224,'+(0.62+0.32*accum)+')');
    brSnow.addColorStop(1,'rgba(119,137,159,'+(0.55+0.32*accum)+')');
    tlctx.strokeStyle=brSnow; tlctx.lineWidth=1.2+1.6*accum;
    tlctx.beginPath(); tlctx.moveTo(x,y-1.2); tlctx.quadraticCurveTo(x+dx*len*0.5, y+dy*len*0.3-1.8, ex,ey-1.2); tlctx.stroke();
    tlctx.fillStyle='rgba(174,190,210,0.90)';
    tlctx.beginPath(); tlctx.arc(ex,ey-1,(1.2+Math.random()*1.2)*(0.7+accum*0.8),0,6.2832); tlctx.fill();
  }
  function drawLamps(t, pulseP){
    var warmCol='rgb('+Math.round(255-27*skyState.dawnMix)+','+Math.round(246-34*skyState.duskMix+2*skyState.dawnMix)+','+Math.round(218-70*skyState.duskMix+37*skyState.dawnMix)+')';
    var palettes=[ [warmCol],
                   ['#ff5d5d','#ffd75e','#7ec8ff','#ff9de2','#7dff9e'],
                   ['#ff4d4d','#ffd75e'],
                   [warmCol,'#ffd75e','#ff9de2','#7ec8ff'] ];
    var mode=lampMode%4;
    var pal=palettes[mode];
    var phase=(t*0.00055)%1;
    var pBoost=pulseP||0;
    var toneMul=1-0.16*skyState.dawnMix+0.06*skyState.duskMix;
    var mGlow=1+musicEnergy*0.35, mAlpha=(1+musicEnergy*0.22)*toneMul, mRay=1+musicEnergy*0.12;
    for(var i=0;i<lamps.length;i++){ var L=lamps[i];
      var tw;
      if(mode===3){
        var d=(phase-L.u+1)%1;
        tw=d<0.36? Math.pow(1-d/0.36,1.5) : 0.05;
      } else {
        tw=0.5+0.5*Math.sin(t*0.001*L.sp+L.ph);
      }
      if(pBoost>0) tw=tw+(1-tw)*pBoost;
      var al=Math.min(1,(mode===3 ? (0.12+0.88*tw) : (0.35+0.65*tw))*mAlpha);
      if(pBoost>0) al=Math.min(1, al+(1-al)*pBoost);
      var col=pal[L.ci%pal.length];
      ctx.save();
      ctx.globalAlpha=al;
      ctx.shadowColor=col; ctx.shadowBlur=(8+10*tw)*mGlow+6*pBoost;
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(L.x,L.y,L.r*(0.8+0.4*tw+0.25*pBoost),0,6.2832); ctx.fill();
      ctx.strokeStyle=col; ctx.globalAlpha=al*0.8; ctx.lineWidth=0.8;
      var sr=L.r*(1.6+1.6*tw)*mRay*(1+0.25*pBoost);
      ctx.beginPath();
      ctx.moveTo(L.x-sr,L.y); ctx.lineTo(L.x+sr,L.y);
      ctx.moveTo(L.x,L.y-sr); ctx.lineTo(L.x,L.y+sr);
      ctx.stroke();
      ctx.restore();
    }
  }
  function house(x,y,s,wob,idx,p){
    var wx1=x-s*0.30, wx2=x+s*0.08, wy=y-s*0.42, ww=s*0.22;
    var warm=Math.min(1,Math.max(0,(accum-0.35)/0.65));
    tctx.save();
    if(wob>0){
      var ph=p*18.85+idx*0.9, osc=Math.sin(ph);
      tctx.translate(x+wob*osc*2.2, y);
      tctx.rotate(wob*osc*0.045);
      tctx.translate(-x, -y);
    }
    // 房屋底部接地环境光遮蔽(AO)
    var hAoRx=s*0.64, hAoRy=s*0.105;
    tctx.save();
    tctx.translate(x, y+s*0.014);
    tctx.scale(1, hAoRy/hAoRx);
    var hAoG=tctx.createRadialGradient(0,0,hAoRx*0.10,0,0,hAoRx);
    hAoG.addColorStop(0,'rgba(8,14,26,0.52)');
    hAoG.addColorStop(0.50,'rgba(12,22,38,0.26)');
    hAoG.addColorStop(1,'rgba(16,26,40,0)');
    tctx.fillStyle=hAoG;
    tctx.beginPath(); tctx.arc(0,0,hAoRx,0,6.2832); tctx.fill();
    tctx.restore();
    // 墙体冷调明暗（檐下偏暗、顶部微受冷天光、底部压暗）
    var wallG=tctx.createLinearGradient(0,y-s*0.55,0,y);
    wallG.addColorStop(0,'#3b3536');
    wallG.addColorStop(0.35,'#4e423b');
    wallG.addColorStop(1,'#282328');
    tctx.fillStyle=wallG; tctx.fillRect(x-s*0.5,y-s*0.55,s,s*0.55);
    // 墙根接触雪地线性 AO
    var wAoG=tctx.createLinearGradient(0,y-s*0.18,0,y);
    wAoG.addColorStop(0,'rgba(8,14,24,0)');
    wAoG.addColorStop(1,'rgba(8,14,24,0.40)');
    tctx.fillStyle=wAoG; tctx.fillRect(x-s*0.5,y-s*0.18,s,s*0.18);

    var roofG=tctx.createLinearGradient(0,y-s*1.0,0,y-s*0.55);

      meteor.dx=dir*R*(0.55+Math.random()*0.30);
      meteor.dy=H*(0.10+Math.random()*0.09);

    if(!meteor.active) return;
    var p=(t-meteor.start)/meteor.dur;

  function resetSmoke(p,randAge){
    var ch=chimneys[p.ci%chimneys.length];
    if(!ch) return;
    p.life=randAge? Math.random()*p.maxLife : 0;
    p.x=ch.x+(Math.random()-0.5)*ch.s*0.05;
    p.y=ch.y-p.life*ch.s*0.015;
    p.r=ch.s*(0.06+Math.random()*0.03);
    p.ph=Math.random()*6.2832;
    p.vx=(Math.random()-0.5)*0.08;
  }
  function initSmokes(){
    smokes.length=0;
    var thrs=[0.18,0.42,0.68];
    for(var ci=0;ci<chimneys.length;ci++){
      for(var k=0;k<8;k++){
        var extra=k>=5;
        var p={ci:ci, maxLife:95+Math.random()*35, life:0, x:0, y:0, r:2, ph:0, vx:0, extra:extra, thr:extra?thrs[k-5]:0, active:!extra};
        if(!extra) resetSmoke(p,true);

  initSmokes();
  function drawSmokes(){
    if(!chimneys.length) return;
    ctx.save();
    for(var i=0;i<smokes.length;i++){
      var p=smokes[i], ch=chimneys[p.ci%chimneys.length];
      if(p.extra){
        if(!p.active){
          if(boost>=p.thr){ resetSmoke(p,false); p.active=true; }
          else continue;
        }
      }
      p.life+=1+boost*0.95;
      if(p.life>=p.maxLife){
        if(p.extra && boost<p.thr){ p.active=false; continue; }
        resetSmoke(p,false); ch=chimneys[p.ci%chimneys.length];
      }
      var pr=p.life/p.maxLife;
      p.y-=0.24*(ch.s/40+0.6)*(1+boost*1.15);
      p.x+=Math.sin(p.ph+p.life*0.06)*(0.18+boost*0.45)+p.vx;
      var rad=p.r*(1+pr*2.1);
      var alpha=Math.sin(pr*3.1416)*(0.24+boost*0.30);
      if(alpha<=0.005) continue;
      ctx.globalAlpha=alpha;
      ctx.fillStyle='#e6eef8';

    }
    ctx.restore();
  }

  function drawSnowman(x,y,s,prog,melting,t){
    if(prog<=0.005) return;
    var ease=1-Math.pow(1-prog,2);
    var sx=melting? (0.85+0.15*prog) : (0.55+0.45*ease);
    var sy=melting? (0.25+0.75*prog) : (0.55+0.45*ease);
    var alpha=melting? Math.min(1,prog*1.35) : ease;
    var outfit=snowmanOutfits[snowmanOutfit%snowmanOutfits.length];

      if(bp>=1){

      } else {
        jump=Math.sin(bp*3.1416);
        var sq=Math.sin(bp*6.2832)*(1-bp)*0.15;
        bounceY=-s*0.18*jump;
        bSx=1-sq*0.65;
        bSy=1+sq;

    ctx.globalAlpha=alpha;
    ctx.translate(x,y);
    ctx.scale(sx,sy);

    var shScale=1-jump*0.18;

      var aW=snowmanAoSpec.gw*shScale, aH=snowmanAoSpec.gh*shScale;
      ctx.drawImage(snowmanAoLayer, -aW*0.5, -aH*0.5, aW, aH);
    }
    ctx.save();
    ctx.translate(0,bounceY);
    ctx.scale(bSx,bSy);
    // 树枝手臂（雪人完成后右臂缓慢周期性挥手）

    ctx.beginPath();

    ctx.moveTo(s*0.18,-s*0.10); ctx.lineTo(s*0.26,-s*0.22);
    ctx.stroke();
    ctx.restore();
    // 下身雪球（顶部冷蓝高光 #d4e2f5/#c2cfe0 → 底部暗 #708299 + 淡蓝轮廓光 + 预渲染底部 AO）
    var r1=s*0.36, y1=-r1*0.92;

    ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(0,y2,r2,0,6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(0,y2,r2-0.4,3.4,5.4); ctx.stroke();
    // 围巾 + 随 boost 轻微飘动的末端

    ctx.arc(0,y1+r1*0.12,s*0.036,0,6.2832);
    ctx.ellipse(-r2*0.32,y2-r2*0.14,eyeR,eyeRy,0,0,6.2832);
    ctx.ellipse(r2*0.32,y2-r2*0.14,eyeR,eyeRy,0,0,6.2832);
    ctx.fill();
    // 胡萝卜鼻子（v15：轻微上下摆动）
    ctx.save();
    var noseSway=Math.sin((t||0)*0.0022)*r2*0.05;

    ctx.rotate(noseSway/r2*0.12);
    ctx.translate(0, -y2);
    ctx.fillStyle='#f08c28';
    ctx.beginPath(); ctx.moveTo(0,y2-r2*0.04); ctx.lineTo(s*0.20,y2+r2*0.06); ctx.lineTo(0,y2+r2*0.16); ctx.closePath(); ctx.fill();

    // 小礼帽（雪人渐显完成瞬间从上方落下并轻微弹跳一次到位）
    if(hatProg>0){

        hatDy=-r2*0.42*Math.sin(t2*3.1416);

      ctx.globalAlpha*=Math.min(1,u*4);
      ctx.translate(0,y2-r2*0.86+hatDy);
      ctx.rotate(hatRot);
      ctx.fillStyle=outfit.hat;
      ctx.fillRect(-r2*1.05,0,r2*2.1,s*0.065);
      ctx.fillRect(-r2*0.68,-r2*0.72,r2*1.36,r2*0.75);
      ctx.fillStyle=outfit.band;
      ctx.fillRect(-r2*0.68,-r2*0.18,r2*1.36,s*0.048);

    }
    ctx.restore();
    ctx.restore();

  function drawFootprints(){
    var accumDelta=accum-prevAccum;
    if(accumDelta>0.004) footprintActive=true;
    prevAccum=accum;
    if(footprintActive && accum>0.38){
      var accumBoost=Math.min(1, Math.max(0, (accum-0.35)/0.65));
      footprintAlpha=Math.min(1, footprintAlpha+0.024);
      footprintReveal=Math.min(1, footprintReveal+0.0085+0.0075*accumBoost);
      // 雪暴（accum上升或高风雪）时新雪逐步覆盖已有脚印，雪停后缓慢重现
      var stormActive=(accumDelta>0.001 || boost>0.24) && footprintReveal>0.28;
      if(stormActive){
        var coverTarget=Math.min(0.94, 0.36+0.44*accumBoost+0.32*boost);
        if(footprintCover<coverTarget){
          footprintCover=Math.min(coverTarget, footprintCover+0.011+0.014*Math.max(boost, accumBoost));
        }
      } else if(boost<0.16 && footprintCover>0){
        footprintCover=Math.max(0, footprintCover-0.0042);

    } else if(footprintAlpha>0){
      footprintAlpha=Math.max(0, footprintAlpha-0.0030);
      if(footprintCover>0) footprintCover=Math.max(0, footprintCover-0.0042);
      if(footprintAlpha<=0){ footprintReveal=0; footprintCover=0; footprintActive=false; }
    }
    if(footprintAlpha<=0.005 || footprintReveal<=0.005) return;
    var cx=W/2, baseY=H*0.875, treeH=H*0.60, steps=8;
    var sx=cx+treeH*0.185, sy=baseY+treeH*0.075;
    var ex=cx+treeH*0.505, ey=baseY+treeH*0.017;
    var arcAmp=treeH*0.013;
    var baseRx=Math.max(1.8,treeH*0.0125), baseRy=Math.max(1.05,treeH*0.0070);
    var snowTopCol=rgbStr(skyState.gf0);
    var snowMidCol=rgbStr(skyState.gf1);
    ctx.save();
    for(var i=0;i<steps;i++){
      var stepFade=Math.max(0,Math.min(1,(footprintReveal-i*0.105)/0.18))*footprintAlpha;
      if(stepFade<=0.01) continue;
      var u=i/(steps-1);
      // 透视缩放与深浅：近处(树裙右前)大且深，远处(右侧小屋前)小且淡
      var persp=1-0.42*u;
      var depthFade=1-0.44*u;
      var px0=sx+(ex-sx)*u, py0=sy+(ey-sy)*u+Math.sin(u*3.1416)*arcAmp;
      var tx=ex-sx, ty=(ey-sy)+Math.cos(u*3.1416)*3.1416*arcAmp;
      var pathAng=Math.atan2(ty,tx), nx=-Math.sin(pathAng), ny=Math.cos(pathAng);
      var lr=(i%2===0?1:-1);
      var strideOff=lr*treeH*0.0115*persp;
      var px=px0+nx*strideOff, py=py0+ny*strideOff;
      var footAng=pathAng+lr*0.135+Math.sin(i*2.37+0.5)*0.045;
      var rx=baseRx*persp, ry=baseRy*persp;
      var alphaBase=stepFade*depthFade;
      // 每步略微错开新雪覆盖进度，呈现风吹雪斑驳填平感
      var stepCov=Math.max(0, Math.min(1, footprintCover*(0.88+0.24*((i*37%10)/10))));
      var pitVis=1-stepCov*0.86;
      var ridgeVis=1-stepCov*0.74;
      ctx.save();
      ctx.translate(px,py);
      ctx.rotate(footAng);
      // 1) 边缘积雪隆起淡蓝阴影（外沿受压隆起背光侧）
      ctx.globalAlpha=0.36*alphaBase*ridgeVis;
      ctx.fillStyle='#7c99ba';
      ctx.beginPath(); ctx.ellipse(rx*0.08,ry*0.28,rx*1.20,ry*1.26,0,0,6.2832); ctx.fill();
      // 2) 边缘积雪隆起白色高光（踩踏挤出的雪埂亮边）
      ctx.globalAlpha=0.62*alphaBase*ridgeVis;
      ctx.strokeStyle='#f2f7ff';
      ctx.lineWidth=Math.max(0.85,ry*0.42);
      ctx.beginPath(); ctx.ellipse(0,-ry*0.06,rx*1.06,ry*1.10,0,0,6.2832); ctx.stroke();
      // 3) 椭圆压扁凹陷脚印（脚掌 + 脚跟，随新雪覆盖逐渐变浅）
      ctx.globalAlpha=0.66*alphaBase*pitVis;
      ctx.fillStyle='#435c7c';
      ctx.beginPath(); ctx.ellipse(rx*0.18,0,rx*0.72,ry*0.92,0,0,6.2832); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-rx*0.60,0,rx*0.40,ry*0.74,0,0,6.2832); ctx.fill();
      ctx.globalAlpha=0.42*alphaBase*pitVis;
      ctx.fillStyle='#6987ab';
      ctx.beginPath(); ctx.ellipse(rx*0.18,ry*0.16,rx*0.58,ry*0.68,0,0,6.2832); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-rx*0.60,ry*0.14,rx*0.30,ry*0.52,0,0,6.2832); ctx.fill();
      // 4) 坑沿下方受光微高光唇边
      ctx.globalAlpha=0.45*alphaBase*ridgeVis;
      ctx.strokeStyle='#e8f2ff';
      ctx.lineWidth=Math.max(0.6,ry*0.24);
      ctx.beginPath(); ctx.ellipse(rx*0.16,ry*0.12,rx*0.72,ry*0.88,0,0.25,2.89); ctx.stroke();
      // 5) 新雪填埋层：雪暴时白色/主题雪色逐渐覆盖脚印坑与雪埂，雪停后渐退露出脚印
      if(stepCov>0.02){
        ctx.globalAlpha=0.76*stepCov*alphaBase;
        ctx.fillStyle=snowTopCol;
        ctx.beginPath(); ctx.ellipse(0,0,rx*(1.08+0.26*stepCov),ry*(1.08+0.26*stepCov),0,0,6.2832); ctx.fill();
        ctx.globalAlpha=0.48*stepCov*alphaBase;
        ctx.fillStyle=snowMidCol;
        ctx.beginPath(); ctx.ellipse(rx*0.12,ry*0.06,rx*0.82,ry*0.82,0,0,6.2832); ctx.fill();
      }
      ctx.restore();
    }
    ctx.restore();
  }
  function drawSquirrel(t){
    if(squirrel.nextAt===0) squirrel.nextAt=t+2200+Math.random()*2800;
    if(squirrel.nextTreeAt===0) squirrel.nextTreeAt=t+8000+Math.random()*7000;
    var cx=W/2, baseY=H*0.875, treeH=H*0.60, s=treeH*0.052;
    var snowX=cx-treeH*0.41+squirrel.offset*treeH*0.032, snowY=baseY+treeH*0.044;
    var treeX=cx-treeH*0.195, treeY=baseY-treeH*0.115;
    var bx=snowX, by=snowY, sqSx=1, sqSy=1, moving=false, inAir=false;
    if(squirrel.treePhase===0){
      if(t>=squirrel.nextTreeAt){
        squirrel.treePhase=1; squirrel.treeStart=t;
        squirrel.fromX=snowX; squirrel.fromY=snowY;
        squirrel.stayDur=2200+Math.random()*1300;
      } else {
        if(t>=squirrel.nextAt){
          squirrel.target=(Math.random()*2-1);
          squirrel.nextAt=t+3500+Math.random()*3500;
        }
        var diff=squirrel.target-squirrel.offset;
        squirrel.offset+=diff*0.035;
        moving=Math.abs(diff)>0.04;
        if(moving) squirrel.dir=diff>0?1:-1;
        snowX=cx-treeH*0.41+squirrel.offset*treeH*0.032;
        bx=snowX;
        by=snowY-(moving?Math.abs(Math.sin(t*0.016))*s*0.14:0);
      }
    }
    if(squirrel.treePhase===1){
      var upDur=660, u=Math.min(1,(t-squirrel.treeStart)/upDur);
      var eu=u<0.5? 2*u*u : 1-Math.pow(-2*u+2,2)/2;
      bx=squirrel.fromX+(treeX-squirrel.fromX)*eu;
      by=squirrel.fromY+(treeY-squirrel.fromY)*eu-Math.sin(u*3.1416)*treeH*0.135;
      squirrel.dir=1; inAir=true;
      if(u<0.18){ var p0=1-u/0.18; sqSx=1+0.14*p0; sqSy=1-0.14*p0; }
      else if(u<0.82){ var p1=Math.sin((u-0.18)/0.64*3.1416); sqSx=1-0.12*p1; sqSy=1+0.15*p1; }
      else { var p2=(u-0.82)/0.18; sqSx=1+0.16*p2; sqSy=1-0.16*p2; }
      if(u>=1){ squirrel.treePhase=2; squirrel.treeStart=t; inAir=false; }
    } else if(squirrel.treePhase===2){
      var ageP=t-squirrel.treeStart;
      bx=treeX; by=treeY;
      if(ageP<240){
        var lp=1-ageP/240;
        sqSx=1+0.16*lp*Math.cos(lp*3.1416*0.5);
        sqSy=1-0.16*lp*Math.cos(lp*3.1416*0.5);
      }
      squirrel.dir=(ageP>squirrel.stayDur*0.42 && ageP<squirrel.stayDur*0.78)? -1 : 1;
      by-=Math.abs(Math.sin(ageP*0.005))*s*0.04;
      if(ageP>=squirrel.stayDur){ squirrel.treePhase=3; squirrel.treeStart=t; }
    } else if(squirrel.treePhase===3){
      var dnDur=680, d=Math.min(1,(t-squirrel.treeStart)/dnDur);
      var ed=d<0.5? 2*d*d : 1-Math.pow(-2*d+2,2)/2;
      var landX=cx-treeH*0.41+squirrel.offset*treeH*0.032, landY=baseY+treeH*0.044;
      bx=treeX+(landX-treeX)*ed;
      by=treeY+(landY-treeY)*ed-Math.sin(d*3.1416)*treeH*0.125;
      squirrel.dir=-1; inAir=true;
      if(d<0.16){ var q0=1-d/0.16; sqSx=1+0.12*q0; sqSy=1-0.12*q0; }
      else if(d<0.82){ var q1=Math.sin((d-0.16)/0.66*3.1416); sqSx=1-0.11*q1; sqSy=1+0.14*q1; }
      else { var q2=(d-0.82)/0.18; sqSx=1+0.18*q2; sqSy=1-0.17*q2; }
      if(d>=1){
        squirrel.treePhase=0;
        squirrel.nextTreeAt=t+8000+Math.random()*7000;
        squirrel.nextAt=t+1400+Math.random()*2200;
      }
    }
    var tailAng=Math.sin(t*0.0038)*0.12+((moving||inAir)?Math.sin(t*0.018)*0.22:0);
    ctx.save();
    ctx.translate(bx,by);
    ctx.scale(squirrel.dir*sqSx,sqSy);
    if(!inAir){
      ctx.fillStyle='rgba(16,26,40,0.34)';
      ctx.beginPath(); ctx.ellipse(0,0,s*0.42,s*0.10,0,0,6.2832); ctx.fill();
    }
    // 蓬松尾巴
    ctx.save();
    ctx.translate(-s*0.18,-s*0.16);
    ctx.rotate(tailAng);
    ctx.fillStyle='#a85524';
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.bezierCurveTo(-s*0.45,-s*0.02,-s*0.68,-s*0.48,-s*0.38,-s*0.84);

    ctx.bezierCurveTo(-s*0.22,-s*0.34,-s*0.06,-s*0.18,0,0);
    ctx.fill();
    ctx.fillStyle='#c9703a';
    ctx.beginPath(); ctx.ellipse(-s*0.33,-s*0.58,s*0.11,s*0.22,-0.35,0,6.2832); ctx.fill();
    ctx.restore();
    // 身体与肚皮
    ctx.fillStyle='#b8602a';
    ctx.beginPath(); ctx.ellipse(-s*0.02,-s*0.26,s*0.28,s*0.22,-0.25,0,6.2832); ctx.fill();
    ctx.fillStyle='#f0cfa9';
    ctx.beginPath(); ctx.ellipse(s*0.08,-s*0.24,s*0.13,s*0.15,-0.2,0,6.2832); ctx.fill();

    ctx.beginPath(); ctx.arc(s*0.19,-s*0.49,s*0.18,0,6.2832); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(s*0.08,-s*0.62); ctx.lineTo(s*0.04,-s*0.82); ctx.lineTo(s*0.17,-s*0.66);
    ctx.moveTo(s*0.18,-s*0.64); ctx.lineTo(s*0.21,-s*0.83); ctx.lineTo(s*0.28,-s*0.63);
    ctx.fill();
    // 眼睛与鼻尖
    ctx.fillStyle='#1f232b';
    ctx.beginPath(); ctx.arc(s*0.25,-s*0.51,s*0.032,0,6.2832); ctx.arc(s*0.36,-s*0.48,s*0.025,0,6.2832); ctx.fill();
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.arc(s*0.24,-s*0.52,s*0.011,0,6.2832); ctx.fill();
    ctx.restore();
  }

  function resetLightDrop(p, randAge){

      return;
    }
    var hitTree=hitTestTree(e.clientX, e.clientY);
    if(hitTree){
      if(skyTapTimer){ clearTimeout(skyTapTimer); skyTapTimer=null; }
      treePendingPtrId=e.pointerId;
    } else {
      skyTapPending=true;
      var skyPt=clientToSceneCoords(e.clientX, e.clientY);
      if(skyPt && skyTapTimer && (performance.now()-lastSkyTapAt)<=DBL_TAP_MS && Math.hypot(e.clientX-lastSkyTapX, e.clientY-lastSkyTapY)<42){
        clearTimeout(skyTapTimer); skyTapTimer=null;
        skyDblCandidate=true;
      }
    }
    holdPtrId=e.pointerId; holdX=e.clientX; holdY=e.clientY;
    holdTimer=setTimeout(function(){
      holdTimer=null; holdPtrId=null; holdFired=true;
      treePendingPtrId=null; skyTapPending=false; skyDblCandidate=false;
      snowmanTarget=snowmanTarget?0:1;
    }, 1000);
  });
  window.addEventListener('pointermove', function(e){
    try{ if(typeof addMouseSnow==='function') addMouseSnow(e.clientX, e.clientY); }catch(_e){}
    var pIdx=findPtrIdx(e.pointerId);
    if(pIdx>=0){
      activePtrs[pIdx].x=e.clientX;
      activePtrs[pIdx].y=e.clientY;
    }
    if(isPinching && activePtrs.length>=2){
      var dist=Math.hypot(activePtrs[0].x-activePtrs[1].x, activePtrs[0].y-activePtrs[1].y);
      if(pinchStartDist>8){
        sceneZoomTarget=Math.max(0.85, Math.min(1.15, pinchStartZoom*(dist/pinchStartDist)));
      }
      return;
    }
    if(e.pointerId===dragPtrId){
      var dx=e.clientX-dragStartX, dy=e.clientY-dragStartY;
      if(!isDraggingTilt && Math.hypot(dx, dy)>14){
        if(skyTapTimer){ clearTimeout(skyTapTimer); skyTapTimer=null; }
        isDraggingTilt=true;
        clearHold();
        clearPending();
      }
      if(isDraggingTilt){
        var sc=Math.max(0.75, W/400);
        tiltXTarget=Math.max(-14, Math.min(14, dx*0.12))*sc;
        tiltYTarget=Math.max(-10, Math.min(10, dy*0.09))*sc;
        tiltRotTarget=Math.max(-3.6, Math.min(3.6, dx*0.032));
      }
    }
  });
  function handlePtrEnd(e, isCancel){
    var pIdx=findPtrIdx(e.pointerId);
    if(pIdx>=0) activePtrs.splice(pIdx, 1);
    if(activePtrs.length<2) isPinching=false;
    if(e.pointerId===dragPtrId){
      dragPtrId=null;
      if(isDraggingTilt){
        isDraggingTilt=false;
        tiltXTarget=0; tiltYTarget=0; tiltRotTarget=0;
        clearHold(); clearPending();
        return;
      }
    }
    if(wasPinchGesture){
      if(activePtrs.length===0) wasPinchGesture=false;
      clearHold(); clearPending();
      return;
    }
    if(isCancel){
      if(e.pointerId===holdPtrId || e.pointerId===giftPendingPtrId || e.pointerId===snowmanPendingPtrId || e.pointerId===treePendingPtrId){
        clearHold(); clearPending();
      }
      return;
    }
    if(giftPendingPtrId!==null && e.pointerId===giftPendingPtrId){
      var gi=giftPendingIdx;
      clearHold(); clearPending();
      var gst=giftStates[gi];
      if(gst){
        gst.target=gst.target?0:1;
        if(gst.target===1){ spawnGiftBurst(giftSpecs[gi], gi); pushGiftText(gi); }
      }
      return;
    }
    if(snowmanPendingPtrId!==null && e.pointerId===snowmanPendingPtrId){
      clearHold(); clearPending();
      if(snowmanProg>=1 && snowmanTarget===1){
        snowmanOutfit=(snowmanOutfit+1)%snowmanOutfits.length;
        snowmanBounceStart=performance.now();
        snowmanBounceActive=true;
      }
      return;
    }
    // v14 点天使（aws-quick/smart）
    if(treePendingPtrId!==null && e.pointerId===treePendingPtrId && hitTestAngel(e.clientX, e.clientY)){
      triggerAngel(performance.now());
      clearHold(); clearPending();
      return;
    }
    if(treePendingPtrId!==null && e.pointerId===treePendingPtrId){
      // v19 双击树落雪（先于装饰球）
      var _tsp=null; try{ _tsp=clientToSceneCoords(e.clientX, e.clientY); }catch(_e){}
      var _tNow=performance.now();
      if(_tsp && hitTestTree(_tsp.x,_tsp.y)){
        if(_tNow-lastTreeTapAt<DBL_TAP_MS && Math.abs(_tsp.x-lastTreeTapX)<R*0.25 && Math.abs(_tsp.y-lastTreeTapY)<R*0.25){
          lastTreeTapAt=0; triggerTreeSnow(); clearHold(); clearPending(); return;
        }
        lastTreeTapAt=_tNow; lastTreeTapX=_tsp.x; lastTreeTapY=_tsp.y;
      }
      // v18 点装饰球（先于房子/树脉冲）
      var _osp=null,_oi=-1;
      try{ _osp=clientToSceneCoords(e.clientX, e.clientY); if(_osp) _oi=hitTestOrnament(_osp.x, _osp.y); }catch(_e){}
      if(_oi>=0){ triggerOrnament(_oi, performance.now()); clearHold(); clearPending(); return; }
      // v16 点屋切换窗光（先于树脉冲）
      var hpt=null, hi=-1;
      try{ hpt=clientToSceneCoords(e.clientX, e.clientY); if(hpt) hi=hitTestHouse(hpt.x, hpt.y); }catch(_e){}
      if(hi>=0){ toggleHouseLight(hi); clearHold(); clearPending(); return; }
      triggerTreePulse();
      clearHold(); clearPending();
      return;
    }
    if(skyTapPending && !holdFired){
      var skyEndPt=clientToSceneCoords(e.clientX, e.clientY);
      if(skyDblCandidate && skyEndPt){
        skyDblCandidate=false; lastSkyTapAt=0;
        spawnFirework(skyEndPt);
      } else if(skyEndPt){
        lastSkyTapAt=performance.now(); lastSkyTapX=e.clientX; lastSkyTapY=e.clientY;
        if(skyTapTimer) clearTimeout(skyTapTimer);
        skyTapTimer=setTimeout(function(){ skyTapTimer=null; shake(); }, DBL_TAP_MS);
      } else {
        if(skyTapTimer){ clearTimeout(skyTapTimer); skyTapTimer=null; }
        shake();
      }
    }
    if(e.pointerId===holdPtrId || skyTapPending){
      clearHold(); clearPending();
    }
  }
  window.addEventListener('pointerup', function(e){ handlePtrEnd(e, false); });
  window.addEventListener('pointercancel', function(e){ handlePtrEnd(e, true); });
  // ---------- 底座铭牌切换 ----------
  var plateEl=document.getElementById('plate');
  if(typeof initSnapshotButton==='function') initSnapshotButton();
  if(typeof initXmasCountdown==='function') initXmasCountdown();
  if(typeof xfxInitViewToggle==='function') xfxInitViewToggle();

  // v14 底座长按震动（aws-quick/smart）
  var plateShake={holding:false,active:false,t0:0,timer:0,suppress:false};
  function plateShakeOffset(){ if(!plateShake.active) return {x:0,y:0};
    var t=(performance.now()-plateShake.t0)/1000, k=1-(t%0.4)/0.4;
    return { x:Math.sin(t*90)*2.2*k, y:Math.cos(t*70)*1.2*k }; }
  function initPlateLongPress(){
    if(!plateEl) return;
    var st=document.createElement('style');
    st.textContent='@keyframes plateShakeKF{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-2px,1px) rotate(-1deg)}40%{transform:translate(2px,-1px) rotate(1deg)}60%{transform:translate(-1px,0) rotate(-.6deg)}80%{transform:translate(1px,1px) rotate(.6deg)}}'+
      '.plate-shaking{animation:plateShakeKF .4s linear infinite}.plate-shaking *{animation:plateShakeKF .2s linear infinite}';
    document.head.appendChild(st);
    function start(e){ plateShake.holding=true; plateShake.suppress=false; clearTimeout(plateShake.timer);
      plateShake.timer=setTimeout(function(){ if(!plateShake.holding)return; plateShake.active=true; plateShake.suppress=true; plateShake.t0=performance.now(); plateEl.classList.add('plate-shaking'); if(navigator.vibrate)navigator.vibrate(60); },800); }
    function end(){ plateShake.holding=false; clearTimeout(plateShake.timer);
      if(plateShake.active){ plateShake.active=false; plateEl.classList.remove('plate-shaking'); } }
    plateEl.addEventListener('pointerdown',start);
    plateEl.addEventListener('pointerup',end);
    plateEl.addEventListener('pointercancel',end);
    plateEl.addEventListener('pointerleave',end);
    plateEl.addEventListener('contextmenu',function(e){ e.preventDefault(); });
    plateEl.addEventListener('click',function(e){ if(plateShake.suppress){ plateShake.suppress=false; e.stopImmediatePropagation(); e.preventDefault(); } },true);
    plateEl.style.touchAction='manipulation';
    plateEl.style.webkitUserSelect='none'; plateEl.style.userSelect='none';
  }
  initPlateLongPress();

  var PLATE_TEXTS=['MERRY CHRISTMAS','HAPPY NEW YEAR','"MERRY CHRISTMAS" from XS'];
  var plateIdx=0, plateFadeTimer=null, plateClickTimer=null;
  if(plateEl){
    plateEl.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    plateEl.addEventListener('pointerup', function(e){ e.stopPropagation(); });
    plateEl.addEventListener('click', function(e){
      e.stopPropagation();
      // v15：双击 = 切换视角（由 xfxInitViewToggle 处理），此时取消换字
      if(plateClickTimer){ clearTimeout(plateClickTimer); plateClickTimer=null; return; }
      plateClickTimer=setTimeout(function(){
        plateClickTimer=null;
        plateIdx=(plateIdx+1)%PLATE_TEXTS.length;
        if(plateFadeTimer) clearTimeout(plateFadeTimer);
        plateEl.style.opacity='0';
        plateFadeTimer=setTimeout(function(){
          plateFadeTimer=null;
          plateEl.textContent=PLATE_TEXTS[plateIdx];
          plateEl.style.letterSpacing=(plateIdx===2)?'.05em':'.14em';
          plateEl.style.opacity='1';
        }, 170);
      }, 320);
    });
  }
  globe.addEventListener('wheel', function(e){
    e.preventDefault();
    var d=Math.max(-120, Math.min(120, e.deltaY));
    sceneZoomTarget=Math.max(0.85, Math.min(1.15, sceneZoomTarget-d*0.0008));
  }, {passive:false});
  globe.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  window.addEventListener('devicemotion', function(e){
    var a=e.accelerationIncludingGravity; if(!a||a.x==null) return;
    if(Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z)>26) shake();
  });
  // ---------- 昼夜切换 ----------
  document.getElementById('sky-btn').addEventListener('click', function(e){
    e.stopPropagation();
    skyMode=(skyMode+1)%3;
    skyTransActive=true;
    this.textContent='🌗 '+SKY_NAMES[skyMode];
  });
  // ---------- 灯色切换 ----------
  document.getElementById('lamp-btn').addEventListener('click', function(e){
    e.stopPropagation(); lampMode=(lampMode+1)%4;
    var names=['暖白','彩灯','红金','流水'];
    this.textContent='💡 '+names[lampMode];
  });
  // ---------- 音乐 ----------
  var bgm=document.getElementById('bgm'), bh=document.getElementById('bgm-hint'), unlocked=false;
  function initAudio(){
    if(audioInited) return;
    audioInited=true;
    try{
      if(!bgm) return;
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      audioCtx=new AC();
      if(audioCtx.state==='suspended' && audioCtx.resume){
        audioCtx.resume().catch(function(){});
      }
      var src=audioCtx.createMediaElementSource(bgm);
      analyser=audioCtx.createAnalyser();
      analyser.fftSize=256;
      analyser.smoothingTimeConstant=0.82;
      src.connect(analyser);
      analyser.connect(audioCtx.destination);
      freqData=new Uint8Array(analyser.frequencyBinCount);
    }catch(e){
      analyser=null; freqData=null;
    }
  }
  function sampleAudio(){
    if(!unlocked || !analyser || !freqData || !bgm || bgm.paused || bgm.muted){
      musicBass*=0.9; musicEnergy*=0.9;
      if(musicBass<0.002) musicBass=0;
      if(musicEnergy<0.002) musicEnergy=0;
      return;
    }
    try{
      analyser.getByteFrequencyData(freqData);
      var n=freqData.length, bassBins=Math.min(4,n), bassSum=0, totalSum=0;
      for(var i=0;i<n;i++){
        var v=freqData[i];
        if(i<bassBins) bassSum+=v;
        totalSum+=v;
      }
      var targetBass=bassBins? (bassSum/(bassBins*255)) : 0;
      var targetEnergy=n? (totalSum/(n*255)) : 0;
      targetBass=Math.min(1,Math.pow(targetBass,1.15)*1.25);
      targetEnergy=Math.min(1,Math.pow(targetEnergy,1.1)*1.3);
      musicBass+=(targetBass-musicBass)*0.24;
      musicEnergy+=(targetEnergy-musicEnergy)*0.22;
    }catch(e){
      musicBass=0; musicEnergy=0;
    }
  }
  function unlockMusic(){ if(unlocked) return; unlocked=true;
    initAudio();
    if(bgm){ bgm.muted=false; bgm.volume=0.55; bgm.play().catch(function(){}); }
    if(bh) bh.style.display='none'; }
  if(bgm){ bgm.play().catch(function(){}); }
  bh.addEventListener('click', unlockMusic);
})();
</script>
</body>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Snow Globe · 圣诞雪景球</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #1a2440 0%, #0a1226 45%, #05080f 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select:none; touch-action:manipulation;
  }
  #ambient { position:fixed; inset:0; z-index:0; pointer-events:none; }
  h1 {
    position:relative; z-index:2; color:#ffe9b0; font-size:clamp(20px,5vw,34px); font-weight:700;
    letter-spacing:.08em; margin-bottom:16px; text-align:center; padding:0 12px;
    text-shadow:0 0 16px rgba(255,214,120,.85), 0 0 42px rgba(255,170,60,.45), 0 2px 6px rgba(0,0,0,.6);
  }
  .wrap { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; }
  .globe { position:relative; width:min(78vw,400px); aspect-ratio:1/1.16; -webkit-user-select:none; -webkit-touch-callout:none; user-select:none; }
  .globe.shaking { animation: shake .7s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    0%,100% { transform:rotate(0) translateX(0); }
    15% { transform:rotate(-4deg) translateX(-10px); }
    30% { transform:rotate(3.5deg) translateX(9px); }
    45% { transform:rotate(-3deg) translateX(-7px); }
    60% { transform:rotate(2.4deg) translateX(6px); }
    75% { transform:rotate(-1.6deg) translateX(-4px); }
    90% { transform:rotate(1deg) translateX(2px); }
  }
  .ball {
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:100%; aspect-ratio:1/1; border-radius:50%; overflow:hidden;
    background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.28), rgba(255,255,255,.05) 38%, rgba(120,170,255,.05) 62%, rgba(10,20,45,.35) 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.22),
      inset 0 0 60px rgba(160,200,255,.22),
      inset -18px -22px 60px rgba(0,10,40,.45),
      inset 14px 16px 40px rgba(255,255,255,.16),
      0 18px 50px rgba(0,0,0,.55),
      0 0 0 1px rgba(220,240,255,.30),
      0 0 12px rgba(150,205,255,.16);
    cursor:grab;
    -webkit-user-select:none; -webkit-touch-callout:none; user-select:none;
  }
  .ball::after {
    content:""; position:absolute; inset:4px; border-radius:50%;
    border:1.5px solid transparent;
    border-top-color:rgba(255,255,255,.32);
    border-left-color:rgba(210,235,255,.18);
    border-bottom-color:rgba(160,210,255,.12);
    transform:rotate(-24deg);
    box-shadow:inset 0 0 10px rgba(200,230,255,.08);
    pointer-events:none; z-index:4;
  }
  .ball:active { cursor:grabbing; }
  .scene { position:absolute; inset:0; }
  .scene svg { position:absolute; inset:0; width:100%; height:100%; }
  #treecv, #snow { position:absolute; inset:0; width:100%; height:100%; }
  .glare {
    position:absolute; top:9%; left:14%; width:34%; height:22%; border-radius:50%;
    background: radial-gradient(ellipse at 40% 40%, rgba(255,255,255,.70), rgba(255,255,255,0) 70%);
    transform:rotate(-22deg); pointer-events:none; filter:blur(1px);
  }
  .glare2 {
    position:absolute; bottom:12%; right:12%; width:16%; height:9%; border-radius:50%;
    background: radial-gradient(ellipse, rgba(255,255,255,.28), rgba(255,255,255,0) 70%);
    transform:rotate(-20deg); pointer-events:none;
  }
  .base {
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:62%; height:17%;
    background: linear-gradient(180deg, #8a5a2b 0%, #6b421c 40%, #4a2c12 100%);
    border-radius:12px 12px 18px 18px / 10px 10px 22px 22px;
    box-shadow: 0 10px 26px rgba(0,0,0,.6), inset 0 3px 6px rgba(255,220,160,.28), inset 0 -6px 12px rgba(0,0,0,.5);
  }
  .base::before {
    content:""; position:absolute; top:-6%; left:6%; width:88%; height:26%;
    background: linear-gradient(180deg, #a06a33, #7a4c20); border-radius:50%;
    box-shadow: inset 0 2px 4px rgba(255,225,170,.35);
  }
  .plate {
    position:absolute; top:38%; left:50%; transform:translateX(-50%);
    color:#ffd98a; font-size:clamp(9px,2.4vw,13px); letter-spacing:.14em; white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.7); font-weight:600;
  }
  .hint {
    position:relative; z-index:2; margin-top:24px; color:#9fb4d8; font-size:14px; letter-spacing:.06em;
    background:rgba(255,255,255,.06); padding:9px 18px; border-radius:22px;
    border:1px solid rgba(255,255,255,.10);
  }
  .hint b { color:#ffd98a; }
  .fab {
    position:fixed; bottom:18px; z-index:99; cursor:pointer;
    background:rgba(0,0,0,.62); color:#ffd966; padding:9px 15px; border-radius:22px;
    font-size:14px; font-weight:600; box-shadow:0 4px 16px rgba(0,0,0,.4);
  }
  #bgm-hint { right:18px; }
  #lamp-btn { left:18px; }
</style>
</head>
<body>
<canvas id="ambient"></canvas>
<h1>"Merry Christmas" from XS</h1>
<div class="wrap">
  <div class="globe" id="globe">
    <div class="ball" id="ball">
      <div class="scene">
        <svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMax meet">
          <ellipse cx="100" cy="178" rx="80" ry="15" fill="#e8f1fb"/>
          <ellipse cx="100" cy="174" rx="68" ry="11" fill="#ffffff"/>
        </svg>
        <canvas id="treecv"></canvas>
        <canvas id="snow"></canvas>
      </div>
      <div class="glare"></div>
      <div class="glare2"></div>
    </div>
    <div class="base"><div class="plate">MERRY CHRISTMAS</div></div>
  </div>
  <div class="hint">🫧 <b>摇一摇 / 点一点球</b> 下大雪·积雪变厚</div>
</div>
<div id="lamp-btn" class="fab">💡 灯色</div>
<div id="bgm-hint" class="fab">🔊 点击开启音乐</div>
<audio id="bgm" src="bgm2.mp3" loop muted preload="auto"></audio>
<script>
(function(){
  var ball=document.getElementById('ball'), cv=document.getElementById('snow'), ctx=cv.getContext('2d');
  var W=0,H=0,CX=0,CY=0,R=0, flakes=[], boost=0, lamps=[], accum=0.35, lampMode=0, lastRedraw=0;
  var chimneys=[], windows=[], smokes=[], snowmanProg=0, snowmanTarget=0, lastTreeAccum=accum;
  var tcv=document.getElementById('treecv'), tctx=tcv.getContext('2d');
  var seed=7;
  function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }

  function size(){ var r=ball.getBoundingClientRect(); W=cv.width=Math.max(10,r.width); H=cv.height=Math.max(10,r.height); CX=W/2; CY=H/2; R=W/2; tcv.width=W; tcv.height=H; drawTree(); }

  // ========== 照真实照片绘制的圣诞树 ==========
  function drawTree(){
    seed=7;
    lastTreeAccum=accum;
    chimneys.length=0;
    windows.length=0;
    tctx.clearRect(0,0,W,H);
    var cx=W/2, baseY=H*0.875, treeH=H*0.60;
    var g0=tctx.createRadialGradient(cx,baseY-treeH*0.45,6,cx,baseY-treeH*0.45,treeH*0.9);
    g0.addColorStop(0,'rgba(255,238,196,0.32)'); g0.addColorStop(0.5,'rgba(255,212,140,0.13)'); g0.addColorStop(1,'rgba(255,200,120,0)');
    tctx.fillStyle=g0; tctx.fillRect(0,0,W,H);
    // 小房子（亮窗）
    house(cx-treeH*0.56, baseY-treeH*0.005, treeH*0.17);
    house(cx+treeH*0.55, baseY+treeH*0.01, treeH*0.13);
    // 白毛绒树裙
    tctx.fillStyle='#fbfcff';
    tctx.beginPath(); tctx.ellipse(cx,baseY+treeH*0.015,treeH*0.44,treeH*0.075,0,0,6.2832); tctx.fill();
    tctx.fillStyle='rgba(255,255,255,0.92)';
    for(var i=0;i<30;i++){ var a=i/30*6.2832;
      tctx.beginPath(); tctx.arc(cx+treeH*0.44*Math.cos(a), baseY+treeH*0.015+treeH*0.075*Math.sin(a), 2.5+rnd()*2,0,6.2832); tctx.fill(); }
    // 礼物堆 8 盒
    gift(cx-treeH*0.34, baseY-treeH*0.005, treeH*0.14, treeH*0.10, '#a8202a', '#ffd75e');
    gift(cx-treeH*0.13, baseY+treeH*0.025, treeH*0.17, treeH*0.115,'#c9a227', '#8c1c1c');
    gift(cx+treeH*0.18, baseY+treeH*0.005, treeH*0.13, treeH*0.095, '#274b8f', '#e8e8e8');
    gift(cx+treeH*0.03, baseY-treeH*0.05, treeH*0.10, treeH*0.075,'#7a1f2b', '#e8c15a');
    gift(cx-treeH*0.23, baseY+treeH*0.045, treeH*0.12, treeH*0.085,'#1f6b4a', '#ffd75e');
    gift(cx+treeH*0.31, baseY+treeH*0.03, treeH*0.11, treeH*0.08, '#8e44ad', '#f5f5f5');
    gift(cx-treeH*0.02, baseY+treeH*0.055, treeH*0.15, treeH*0.10, '#b03a2e', '#f7dc6f');
    gift(cx+treeH*0.11, baseY+treeH*0.05, treeH*0.09, treeH*0.07, '#16a085', '#ffd75e');
    // 浓密锥体 + 挂雪
    var tiers=6;
    for(var L=tiers-1;L>=0;L--){
      var t=L/(tiers-1);
      var topY=baseY-treeH*0.10-(1-t)*treeH*0.80-treeH*0.22;
      var halfW=treeH*0.13+t*treeH*0.31;
      var lh=treeH*0.36;
      drawSolidTier(cx,topY,halfW,lh,L);
    }
    // 外伸下垂枝
    var tiers2=6;
    for(var L2=0;L2<tiers2;L2++){
      var t2=L2/(tiers2-1);
      var y2=baseY-treeH*0.06-(1-t2)*treeH*0.84;
      var spread=treeH*0.12+t2*treeH*0.34;
      var nB=2+Math.round(t2*3);
      for(var s=-1;s<=1;s+=2){
        for(var b=0;b<nB;b++){
          var fr=(b+0.7)/nB;
          var ang=s*(0.7+0.5*fr)+(rnd()-0.5)*0.2;
          var len=spread*(0.35+0.35*fr)*(0.8+rnd()*0.4);
          var droop=(0.25+0.5*t2)*len*0.5;
          drawBranch(cx+s*spread*0.55, y2+treeH*0.05, ang*0.5, len, droop, t2);
        }
      }
    }
    // 灯串位置（闪烁在 tick 画）
    lamps.length=0;
    for(var i2=0;i2<52;i2++){
      var u=rnd();
      var yy=baseY-treeH*0.06-u*treeH*0.86;
      var halfW2=(treeH*0.36*(1-u)+treeH*0.06)*0.85;
      var xx=cx+(rnd()-0.5)*2*halfW2;
      lamps.push({x:xx,y:yy,u:u,r:1.5+rnd()*1.3, sp:2+rnd()*4, ph:rnd()*6.28, ci:(rnd()*5)|0});
    }
    // 天使顶
    angel(cx, baseY-treeH*0.98, treeH*0.085);
  }
  function drawSolidTier(cx,topY,halfW,lh,seedv){
    var teeth=18, i, tt, x, y, jag;
    tctx.beginPath(); tctx.moveTo(cx,topY);
    for(i=0;i<=teeth;i++){ tt=i/teeth;
      x=cx+halfW*tt*(0.66+0.34*Math.sin(tt*2.4+seedv*1.3));
      y=topY+lh*tt; jag=(i%2)? lh*0.06:0;
      tctx.lineTo(x+jag*0.2,y+jag);
      if(i<teeth) tctx.lineTo(cx+halfW*tt*0.84, y+lh*0.04);
    }
    tctx.lineTo(cx,topY+lh*0.94);
    for(i=teeth;i>=0;i--){ tt=i/teeth;
      x=cx-halfW*tt*(0.66+0.34*Math.sin(tt*2.4+seedv*1.3+0.8));
      y=topY+lh*tt; jag=(i%2)? lh*0.06:0;
      tctx.lineTo(x-jag*0.2,y+jag);
      if(i>0) tctx.lineTo(cx-halfW*tt*0.84, y+lh*0.04);
    }
    tctx.closePath();
    var g=tctx.createLinearGradient(0,topY,0,topY+lh);
    g.addColorStop(0,'rgb('+(122+seedv*4)+','+(152+seedv*4)+','+(122+seedv*3)+')');
    g.addColorStop(0.5,'rgb('+(82+seedv*4)+','+(114+seedv*4)+','+(86+seedv*3)+')');
    g.addColorStop(1,'rgb('+(48+seedv*3)+','+(76+seedv*3)+','+(54+seedv*2)+')');
    tctx.fillStyle=g; tctx.fill();
    tctx.save(); tctx.clip();
    for(var k=0;k<50;k++){
      var rx=cx+(Math.random()-0.5)*halfW*1.7, ry=topY+Math.random()*lh;
      tctx.fillStyle=Math.random()>0.5?'rgba(255,255,255,0.07)':'rgba(20,40,24,0.13)';
      tctx.beginPath(); tctx.arc(rx,ry,Math.random()*lh*0.08+1.5,0,6.2832); tctx.fill();
    }
    // 挂雪：厚度随 accum（摇得越猛雪越厚）
    var th=lh*(0.07+0.17*accum);
    tctx.fillStyle='rgba(255,255,255,0.93)';
    tctx.beginPath();
    for(i=0;i<=teeth;i++){ tt=i/teeth; x=cx+halfW*tt*0.88*(i%2?0.95:1); y=topY+lh*tt*0.28+(i%2?2:0); if(i===0)tctx.moveTo(x,y); else tctx.lineTo(x,y); }
    for(i=teeth;i>=0;i--){ tt=i/teeth; x=cx+halfW*tt*0.88*(i%2?0.95:1); y=topY+lh*tt*0.28+(i%2?2:0)+th*(0.7+0.6*Math.sin(tt*7+seedv)); tctx.lineTo(x,y); }
    tctx.closePath(); tctx.fill();
    var nClump=3+Math.round(accum*7);
    for(i=0;i<nClump;i++){ var sx2=cx+(Math.random()-0.5)*halfW*1.5, sy2=topY+lh*0.28*Math.min(1,Math.abs(sx2-cx)/halfW)+th;
      tctx.beginPath(); tctx.arc(sx2,sy2,(1.5+Math.random()*2.5)*(0.7+accum*0.7),0,6.2832); tctx.fill(); }
    tctx.restore();
  }
  function drawBranch(x,y,ang,len,droop,t){
    var dx=Math.sin(ang), dy=0.28+0.22*t;
    var ex=x+dx*len, ey=y+dy*len*0.55+droop;
    tctx.strokeStyle='rgba(72,92,72,0.85)'; tctx.lineWidth=1.5;
    tctx.beginPath(); tctx.moveTo(x,y); tctx.quadraticCurveTo(x+dx*len*0.5, y+dy*len*0.3, ex,ey); tctx.stroke();
    var n=9;
    for(var i=0;i<n;i++){
      var tt=i/n;
      var px=x+dx*len*tt, py=y+(dy*len*0.55+droop)*(tt*tt*0.7+tt*0.3);
      var nl=len*0.17*(1-tt*0.45);
      var side=(dx>=0?1:-1);
      var c=rnd();
      tctx.strokeStyle = c>0.62? 'rgba(158,178,158,0.9)' : (c>0.3? 'rgba(112,140,112,0.92)' : 'rgba(74,102,78,0.92)');
      tctx.lineWidth=1.1;
      tctx.beginPath();
      tctx.moveTo(px,py); tctx.lineTo(px+side*nl*0.7, py+nl*0.45);
      tctx.moveTo(px,py); tctx.lineTo(px-side*nl*0.45, py+nl*0.5);
      tctx.moveTo(px,py); tctx.lineTo(px+side*nl*0.2, py-nl*0.35);
      tctx.stroke();
    }
    // 枝上挂雪（厚度随 accum）
    tctx.strokeStyle='rgba(255,255,255,'+(0.55+0.35*accum)+')'; tctx.lineWidth=1.2+1.6*accum;
    tctx.beginPath(); tctx.moveTo(x,y-1.2); tctx.quadraticCurveTo(x+dx*len*0.5, y+dy*len*0.3-1.8, ex,ey-1.2); tctx.stroke();
    tctx.fillStyle='rgba(255,255,255,0.88)';
    tctx.beginPath(); tctx.arc(ex,ey-1,(1.2+Math.random()*1.2)*(0.7+accum*0.8),0,6.2832); tctx.fill();
  }
  function drawLamps(t){
    var palettes=[ ['#fff6da'],
                   ['#ff5d5d','#ffd75e','#7ec8ff','#ff9de2','#7dff9e'],
                   ['#ff4d4d','#ffd75e'],
                   ['#fff6da','#ffd75e','#ff9de2','#7ec8ff'] ];
    var mode=lampMode%4;
    var pal=palettes[mode];
    var phase=(t*0.00055)%1;
    for(var i=0;i<lamps.length;i++){ var L=lamps[i];
      var tw;
      if(mode===3){
        var d=(phase-L.u+1)%1;
        tw=d<0.36? Math.pow(1-d/0.36,1.5) : 0.05;
      } else {
        tw=0.5+0.5*Math.sin(t*0.001*L.sp+L.ph);
      }
      var al=mode===3 ? (0.12+0.88*tw) : (0.35+0.65*tw);
      var col=pal[L.ci%pal.length];
      ctx.save();
      ctx.globalAlpha=al;
      ctx.shadowColor=col; ctx.shadowBlur=8+10*tw;
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(L.x,L.y,L.r*(0.8+0.4*tw),0,6.2832); ctx.fill();
      ctx.strokeStyle=col; ctx.globalAlpha=al*0.8; ctx.lineWidth=0.8;
      var sr=L.r*(1.6+1.6*tw);
      ctx.beginPath();
      ctx.moveTo(L.x-sr,L.y); ctx.lineTo(L.x+sr,L.y);
      ctx.moveTo(L.x,L.y-sr); ctx.lineTo(L.x,L.y+sr);
      ctx.stroke();
      ctx.restore();
    }
  }
  function house(x,y,s){
    chimneys.push({x:x+s*0.32, y:y-s*0.98, s:s});
    var wx1=x-s*0.30, wx2=x+s*0.08, wy=y-s*0.42, ww=s*0.22;
    windows.push({x:wx1,y:wy,w:ww,h:ww},{x:wx2,y:wy,w:ww,h:ww});
    var warm=Math.min(1,Math.max(0,(accum-0.35)/0.65));
    tctx.save();
    tctx.fillStyle='#5a4632'; tctx.fillRect(x-s*0.5,y-s*0.55,s,s*0.55);
    tctx.fillStyle='#7a3b2e'; tctx.beginPath(); tctx.moveTo(x-s*0.62,y-s*0.55); tctx.lineTo(x,y-s*1.0); tctx.lineTo(x+s*0.62,y-s*0.55); tctx.closePath(); tctx.fill();
    tctx.fillStyle='rgba(255,255,255,0.92)';
    tctx.beginPath(); tctx.moveTo(x-s*0.62,y-s*0.55); tctx.lineTo(x,y-s*1.0); tctx.lineTo(x+s*0.62,y-s*0.55);
    tctx.lineTo(x+s*0.5,y-s*0.50); tctx.lineTo(x,y-s*0.88); tctx.lineTo(x-s*0.5,y-s*0.50); tctx.closePath(); tctx.fill();
    tctx.shadowColor='rgba(255,'+Math.round(192+30*warm)+','+Math.round(78+52*warm)+','+(0.82+0.18*warm)+')';
    tctx.shadowBlur=10+14*accum;
    tctx.fillStyle='rgb(255,'+Math.round(212+28*warm)+','+Math.round(126+54*warm)+')';
    tctx.fillRect(wx1,wy,ww,ww);
    tctx.fillRect(wx2,wy,ww,ww);
    tctx.shadowBlur=0;
    tctx.strokeStyle='#3a2c1e'; tctx.lineWidth=1;
    tctx.strokeRect(wx1,wy,ww,ww); tctx.strokeRect(wx2,wy,ww,ww);
    tctx.fillStyle='#3a2c1e'; tctx.fillRect(x-s*0.10,y-s*0.28,s*0.2,s*0.28);
    tctx.fillStyle='#6b421c'; tctx.fillRect(x+s*0.26,y-s*0.95,s*0.12,s*0.25);
    tctx.fillStyle='rgba(255,255,255,0.9)'; tctx.fillRect(x+s*0.24,y-s*0.98,s*0.16,s*0.05);
    tctx.restore();
  }
  function angel(cx,y,s){
    tctx.save(); tctx.shadowColor='#fff6d8'; tctx.shadowBlur=26;
    tctx.fillStyle='rgba(255,250,236,0.96)';
    tctx.beginPath(); tctx.ellipse(cx,y+s*0.55,s*0.5,s*0.85,0,0,6.2832); tctx.fill();
    tctx.beginPath(); tctx.ellipse(cx-s*0.62,y+s*0.15,s*0.52,s*0.26,-0.55,0,6.2832); tctx.fill();
    tctx.beginPath(); tctx.ellipse(cx+s*0.62,y+s*0.15,s*0.52,s*0.26,0.55,0,6.2832); tctx.fill();
    tctx.beginPath(); tctx.arc(cx,y-s*0.5,s*0.32,0,6.2832); tctx.fill();
    tctx.strokeStyle='rgba(255,240,190,0.9)'; tctx.lineWidth=1.4;
    tctx.beginPath(); tctx.ellipse(cx,y-s*0.85,s*0.3,s*0.1,0,0,6.2832); tctx.stroke();
    tctx.restore();
  }
  function gift(x,y,w,h,c1,c2){
    tctx.save();
    tctx.fillStyle=c1; tctx.fillRect(x-w/2,y-h,w,h);
    tctx.fillStyle='rgba(0,0,0,0.18)'; tctx.fillRect(x-w/2,y-h,w,h*0.22);
    tctx.fillStyle=c2; tctx.fillRect(x-w*0.08,y-h,w*0.16,h); tctx.fillRect(x-w/2,y-h*0.58,w,h*0.16);
    tctx.beginPath(); tctx.arc(x-w*0.10,y-h-h*0.10,w*0.09,0,6.2832); tctx.arc(x+w*0.10,y-h-h*0.10,w*0.09,0,6.2832); tctx.fill();
    tctx.restore();
  }

  size(); window.addEventListener('resize', size);

  function resetSmoke(p,randAge){
    var ch=chimneys[p.ci%chimneys.length];
    if(!ch) return;
    p.life=randAge? Math.random()*p.maxLife : 0;
    p.x=ch.x+(Math.random()-0.5)*ch.s*0.05;
    p.y=ch.y-p.life*ch.s*0.015;
    p.r=ch.s*(0.06+Math.random()*0.03);
    p.ph=Math.random()*6.2832;
    p.vx=(Math.random()-0.5)*0.08;
  }
  function initSmokes(){
    smokes.length=0;
    for(var ci=0;ci<chimneys.length;ci++){
      for(var k=0;k<5;k++){
        var p={ci:ci, maxLife:95+Math.random()*35, life:0, x:0, y:0, r:2, ph:0, vx:0};
        resetSmoke(p,true);
        smokes.push(p);
      }
    }
  }
  initSmokes();
  function drawSmokes(){
    if(!chimneys.length) return;
    ctx.save();
    for(var i=0;i<smokes.length;i++){
      var p=smokes[i], ch=chimneys[p.ci%chimneys.length];
      p.life+=1+boost*0.7;
      if(p.life>=p.maxLife){ resetSmoke(p,false); ch=chimneys[p.ci%chimneys.length]; }
      var pr=p.life/p.maxLife;
      p.y-=0.24*(ch.s/40+0.6)*(1+boost*0.45);
      p.x+=Math.sin(p.ph+p.life*0.06)*(0.18+boost*0.45)+p.vx;
      var rad=p.r*(1+pr*2.1);
      var alpha=Math.sin(pr*3.1416)*0.24*(1-boost*0.25);
      if(alpha<=0.005) continue;
      ctx.globalAlpha=alpha;
      ctx.fillStyle='#e6eef8';
      ctx.beginPath(); ctx.arc(p.x,p.y,rad,0,6.2832); ctx.fill();
    }
    ctx.restore();
  }
  function drawWindowGlow(t){
    var g=Math.min(1,accum*0.65+boost*0.55);
    if(g<=0.05) return;
    var pulse=0.92+0.08*Math.sin(t*0.004);
    ctx.save();
    for(var i=0;i<windows.length;i++){
      var w=windows[i], cxw=w.x+w.w*0.5, cyw=w.y+w.h*0.5, rad=w.w*(1.4+1.1*g);
      var grd=ctx.createRadialGradient(cxw,cyw,w.w*0.15,cxw,cyw,rad);
      grd.addColorStop(0,'rgba(255,235,175,'+(0.38*g*pulse)+')');
      grd.addColorStop(0.55,'rgba(255,190,85,'+(0.20*g*pulse)+')');
      grd.addColorStop(1,'rgba(255,165,60,0)');
      ctx.fillStyle=grd;
      ctx.beginPath(); ctx.arc(cxw,cyw,rad,0,6.2832); ctx.fill();
    }
    ctx.restore();
  }
  function drawSnowman(x,y,s,prog,melting){
    if(prog<=0.005) return;
    var ease=1-Math.pow(1-prog,2);
    var sx=melting? (0.85+0.15*prog) : (0.55+0.45*ease);
    var sy=melting? (0.25+0.75*prog) : (0.55+0.45*ease);
    var alpha=melting? Math.min(1,prog*1.35) : ease;
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.translate(x,y);
    ctx.scale(sx,sy);
    // 地面投影
    ctx.fillStyle='rgba(110,145,190,0.32)';
    ctx.beginPath(); ctx.ellipse(0,0,s*0.44,s*0.11,0,0,6.2832); ctx.fill();
    // 树枝手臂
    ctx.strokeStyle='#5c3d24'; ctx.lineWidth=Math.max(1,s*0.045); ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(-s*0.26,-s*0.48); ctx.lineTo(-s*0.56,-s*0.64);
    ctx.moveTo(-s*0.44,-s*0.58); ctx.lineTo(-s*0.52,-s*0.70);
    ctx.moveTo(s*0.26,-s*0.48); ctx.lineTo(s*0.56,-s*0.64);
    ctx.moveTo(s*0.44,-s*0.58); ctx.lineTo(s*0.52,-s*0.70);
    ctx.stroke();
    // 下身雪球
    var r1=s*0.36, y1=-r1*0.92;
    var g1=ctx.createRadialGradient(-r1*0.25,y1-r1*0.25,r1*0.1,0,y1,r1);
    g1.addColorStop(0,'#ffffff'); g1.addColorStop(1,'#d8e6f5');
    ctx.fillStyle=g1; ctx.beginPath(); ctx.arc(0,y1,r1,0,6.2832); ctx.fill();
    // 头部雪球
    var r2=s*0.25, y2=y1-r1-r2*0.68;
    var g2=ctx.createRadialGradient(-r2*0.25,y2-r2*0.25,r2*0.1,0,y2,r2);
    g2.addColorStop(0,'#ffffff'); g2.addColorStop(1,'#dce8f7');
    ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(0,y2,r2,0,6.2832); ctx.fill();
    // 红围巾
    ctx.fillStyle='#c92a2a';
    ctx.beginPath(); ctx.roundRect? ctx.roundRect(-r2*0.95,y2+r2*0.62,r2*1.9,s*0.10,s*0.04) : ctx.rect(-r2*0.95,y2+r2*0.62,r2*1.9,s*0.10); ctx.fill();
    ctx.fillStyle='#b02020';
    ctx.beginPath(); ctx.moveTo(r2*0.25,y2+r2*0.76); ctx.lineTo(r2*0.65,y2+r2*0.76); ctx.lineTo(r2*0.78,y2+r2*1.45); ctx.lineTo(r2*0.38,y2+r2*1.45); ctx.closePath(); ctx.fill();
    // 纽扣与眼睛
    ctx.fillStyle='#242933';
    ctx.beginPath();
    ctx.arc(0,y1-r1*0.22,s*0.036,0,6.2832);
    ctx.arc(0,y1+r1*0.12,s*0.036,0,6.2832);
    ctx.arc(-r2*0.32,y2-r2*0.14,s*0.030,0,6.2832);
    ctx.arc(r2*0.32,y2-r2*0.14,s*0.030,0,6.2832);
    ctx.fill();
    // 胡萝卜鼻子
    ctx.fillStyle='#f08c28';
    ctx.beginPath(); ctx.moveTo(0,y2-r2*0.04); ctx.lineTo(s*0.20,y2+r2*0.06); ctx.lineTo(0,y2+r2*0.16); ctx.closePath(); ctx.fill();
    // 小礼帽
    ctx.fillStyle='#222630';
    ctx.fillRect(-r2*1.05,y2-r2*0.86,r2*2.1,s*0.065);
    ctx.fillRect(-r2*0.68,y2-r2*1.58,r2*1.36,r2*0.75);
    ctx.fillStyle='#c92a2a';
    ctx.fillRect(-r2*0.68,y2-r2*1.04,r2*1.36,s*0.048);
    ctx.restore();
  }

  // ---------- 球内雪花 ----------
  function inCircle(scale){ var a=Math.random()*6.2832, rr=Math.sqrt(Math.random())*R*(scale||0.9); return {x:CX+Math.cos(a)*rr, y:CY+Math.sin(a)*rr}; }
  function newFlake(){ var p=inCircle(0.9); return { x:p.x, y:p.y, r:Math.random()*2.4+0.7, vy:Math.random()*0.5+0.25, ph:Math.random()*6.28, o:Math.random()*0.55+0.35 }; }
  for(var i=0;i<70;i++) flakes.push(newFlake());
  function resetTop(f){ var dx=f.x-CX; var half=Math.sqrt(Math.max(4,R*R-dx*dx)); f.y=CY-half*0.92; f.vy=Math.random()*0.5+0.25; }
  function tick(now){
    ctx.clearRect(0,0,W,H);
    ctx.save(); ctx.beginPath(); ctx.arc(CX,CY,R,0,6.2832); ctx.clip();
    drawWindowGlow(now);
    drawSmokes();
    drawLamps(now);
    if(snowmanProg<snowmanTarget) snowmanProg=Math.min(1,snowmanProg+0.024);
    else if(snowmanProg>snowmanTarget) snowmanProg=Math.max(0,snowmanProg-0.028);
    if(snowmanProg>0){
      var baseY=H*0.875, treeH=H*0.60;
      drawSnowman(W/2+treeH*0.415, baseY+treeH*0.045, treeH*0.095, snowmanProg, snowmanTarget===0);
    }
    ctx.fillStyle='#ffffff';
    for(var i=0;i<flakes.length;i++){ var f=flakes[i];
      f.ph+=0.02+boost*0.06;
      f.x+=Math.sin(f.ph)*(0.35+boost*1.8)+(Math.random()-0.5)*boost*2.4;
      f.y+=(0.35+boost*2.8)*f.r*0.8+0.2;
      var dx=f.x-CX, dy=f.y-CY, d2=dx*dx+dy*dy;
      if(d2>R*R*0.92 && dy>0){ resetTop(f); }
      else if(d2>R*R){ f.x=CX+(Math.random()-0.5)*R*0.8; f.y=CY-R*0.85; }
      ctx.globalAlpha=f.o; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,6.2832); ctx.fill();
    }
    ctx.globalAlpha=1; ctx.restore();
    if(boost>0) boost=Math.max(0,boost-0.018);
    // 积雪缓慢回落 + 节流重画树
    if(accum>0.35){ accum=Math.max(0.35,accum-0.0008); if(Math.abs(accum-lastTreeAccum)>0.06) accumChanged=true; }
    if(now-lastRedraw>450 && accumChanged){ accumChanged=false; lastRedraw=now; drawTree(); }
    requestAnimationFrame(tick);
  }
  var accumChanged=false;
  requestAnimationFrame(tick);
  // ---------- 外部氛围雪 ----------
  var ac=document.getElementById('ambient'), ax=ac.getContext('2d'), AW=0,AH=0, amb=[];
  function asize(){ AW=ac.width=innerWidth; AH=ac.height=innerHeight; }
  asize(); window.addEventListener('resize', asize);
  for(var j=0;j<50;j++) amb.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2+0.6,s:Math.random()*0.7+0.3,o:Math.random()*0.4+0.15});
  (function atick(){ ax.clearRect(0,0,AW,AH); ax.fillStyle='#fff';
    for(var k=0;k<amb.length;k++){ var p=amb[k]; ax.globalAlpha=p.o; ax.beginPath(); ax.arc(p.x,p.y,p.r,0,6.2832); ax.fill();
      p.y+=p.s; p.x+=Math.sin(p.y*0.01)*0.3; if(p.y>AH+4){p.y=-4;p.x=Math.random()*AW;} }
    ax.globalAlpha=1; requestAnimationFrame(atick); })();
  // ---------- 摇一摇 / 点击 / 长按 ----------
  var globe=document.getElementById('globe'), lastShake=0;
  var holdTimer=null, holdPtrId=null, holdX=0, holdY=0;
  function clearHold(){
    if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
    holdPtrId=null;
  }
  function shake(){
    var now=Date.now(); if(now-lastShake<500) return; lastShake=now;
    boost=1; accum=Math.min(1,accum+0.22); accumChanged=true;
    globe.classList.remove('shaking'); void globe.offsetWidth; globe.classList.add('shaking');
    for(var i=0;i<flakes.length;i++){ flakes[i].vy=Math.random()*2+1.2; }
  }
  globe.addEventListener('pointerdown', function(e){
    shake(); unlockMusic();
    clearHold();
    holdPtrId=e.pointerId; holdX=e.clientX; holdY=e.clientY;
    holdTimer=setTimeout(function(){
      holdTimer=null;
      snowmanTarget=snowmanTarget?0:1;
    }, 1000);
  });
  globe.addEventListener('pointermove', function(e){
    if(!holdTimer || e.pointerId!==holdPtrId) return;
    if(Math.hypot(e.clientX-holdX, e.clientY-holdY)>28) clearHold();
  });
  window.addEventListener('pointerup', function(e){
    if(holdTimer && e.pointerId===holdPtrId) clearHold();
  });
  window.addEventListener('pointercancel', function(e){
    if(holdTimer && e.pointerId===holdPtrId) clearHold();
  });
  globe.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  window.addEventListener('devicemotion', function(e){
    var a=e.accelerationIncludingGravity; if(!a||a.x==null) return;
    if(Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z)>26) shake();
  });
  // ---------- 灯色切换 ----------
  document.getElementById('lamp-btn').addEventListener('click', function(e){
    e.stopPropagation(); lampMode=(lampMode+1)%4;
    var names=['暖白','彩灯','红金','流水'];
    this.textContent='💡 '+names[lampMode];
  });
  // ---------- 音乐 ----------
  var bgm=document.getElementById('bgm'), bh=document.getElementById('bgm-hint'), unlocked=false;
  function unlockMusic(){ if(unlocked) return; unlocked=true;
    if(bgm){ bgm.muted=false; bgm.volume=0.55; bgm.play().catch(function(){}); }
    if(bh) bh.style.display='none'; }
  if(bgm){ bgm.play().catch(function(){}); }
  bh.addEventListener('click', unlockMusic);
})();
</script>
</body>

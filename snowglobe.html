<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Snow Globe · 圣诞雪景球</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    background: radial-gradient(ellipse at 50% 18%, #1e3250 0%, #101a28 48%, #060a12 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select:none; touch-action:manipulation;
  }
  #ambient { position:fixed; inset:0; z-index:0; pointer-events:none; }
  h1 {
    position:relative; z-index:2; color:#ffe9b0; font-size:clamp(20px,5vw,34px); font-weight:700;
    letter-spacing:.08em; margin-bottom:16px; text-align:center; padding:0 12px;
    text-shadow:0 0 16px rgba(255,214,120,.85), 0 0 42px rgba(255,170,60,.45), 0 2px 6px rgba(0,0,0,.6);
  }
  .wrap { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; }
  .globe { position:relative; width:min(78vw,400px); aspect-ratio:1/1.16; -webkit-user-select:none; -webkit-touch-callout:none; user-select:none; touch-action:none; }
  .globe.shaking { animation: shake .7s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    0%,100% { transform:rotate(0) translateX(0); }
    15% { transform:rotate(-4deg) translateX(-10px); }
    30% { transform:rotate(3.5deg) translateX(9px); }
    45% { transform:rotate(-3deg) translateX(-7px); }
    60% { transform:rotate(2.4deg) translateX(6px); }
    75% { transform:rotate(-1.6deg) translateX(-4px); }
    90% { transform:rotate(1deg) translateX(2px); }
  }
  .ball {
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:100%; aspect-ratio:1/1; border-radius:50%; overflow:hidden;
    clip-path:circle(50% at 50% 50%); -webkit-clip-path:circle(50% at 50% 50%);
    background: radial-gradient(circle at 34% 24%, rgba(182,210,245,.26), rgba(136,170,224,.09) 38%, rgba(44,68,100,.22) 68%, rgba(16,26,40,.52) 100%);
    box-shadow:
      inset 0 0 0 1px rgba(212,226,245,.24),
      inset 0 0 60px rgba(136,170,224,.22),
      inset -18px -22px 60px rgba(16,26,40,.58),
      inset 14px 16px 40px rgba(214,230,251,.15),
      0 18px 50px rgba(4,8,16,.65),
      0 0 0 1px rgba(182,210,245,.28),
      0 0 14px rgba(136,170,224,.18);
    cursor:grab;
    -webkit-user-select:none; -webkit-touch-callout:none; user-select:none;
  }
  .ball::after {
    content:""; position:absolute; inset:4px; border-radius:50%;
    border:1.5px solid transparent;
    border-top-color:rgba(255,255,255,.32);
    border-left-color:rgba(210,235,255,.18);
    border-bottom-color:rgba(160,210,255,.12);
    transform:rotate(-24deg);
    box-shadow:inset 0 0 10px rgba(200,230,255,.08);
    pointer-events:none; z-index:4;
  }
  .ball:active { cursor:grabbing; }
  .scene { position:absolute; inset:0; transform-origin:50% 88%; will-change:transform; }
  .scene svg { position:absolute; inset:0; width:100%; height:100%; }
  #skycv, #fogcv, #glasscv { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #skycv { z-index:0; transform:scale(1.08); will-change:transform; }
  .scene { z-index:1; }
  #fogcv { z-index:2; }
  #glasscv { z-index:3; }
  #auroracv, #treecv, #snow { position:absolute; inset:0; width:100%; height:100%; }
  .glare {
    position:absolute; top:9%; left:14%; width:34%; height:22%; border-radius:50%;
    background: radial-gradient(ellipse at 40% 40%, rgba(255,255,255,.70), rgba(255,255,255,0) 70%);
    transform:rotate(-22deg); pointer-events:none; filter:blur(1px); z-index:4;
  }
  .glare2 {
    position:absolute; bottom:12%; right:12%; width:16%; height:9%; border-radius:50%;
    background: radial-gradient(ellipse, rgba(255,255,255,.28), rgba(255,255,255,0) 70%);
    transform:rotate(-20deg); pointer-events:none; z-index:4;
  }
  .base-halo {
    position:absolute; bottom:-2.2%; left:50%; transform:translateX(-50%);
    width:68%; height:21.5%;
    border-radius:18px 18px 26px 26px / 14px 14px 28px 28px;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,216,126,.18) 44%, rgba(255,196,86,.44) 72%, rgba(255,172,58,0) 100%);
    box-shadow: 0 0 18px rgba(255,204,92,.45), inset 0 0 12px rgba(255,228,150,.28);
    border: 1px solid rgba(255,228,148,.38);
    pointer-events:none; opacity:.20; will-change:opacity, transform;
  }
  .base {
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:62%; height:17%;
    background: linear-gradient(180deg, #8a5a2b 0%, #6b421c 40%, #4a2c12 100%);
    border-radius:12px 12px 18px 18px / 10px 10px 22px 22px;
    box-shadow: 0 10px 26px rgba(0,0,0,.6), inset 0 3px 6px rgba(255,220,160,.28), inset 0 -6px 12px rgba(0,0,0,.5);
  }
  .base::before {
    content:""; position:absolute; top:-6%; left:6%; width:88%; height:26%;
    background: linear-gradient(180deg, #a06a33, #7a4c20); border-radius:50%;
    box-shadow: inset 0 2px 4px rgba(255,225,170,.35);
  }
  .plate {
    position:absolute; top:38%; left:50%; transform:translateX(-50%);
    color:#ffd98a; font-size:clamp(9px,2.4vw,13px); letter-spacing:.14em; white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.7); font-weight:600;
  }
  .hint {
    position:relative; z-index:2; margin-top:24px; color:#9fb4d8; font-size:14px; letter-spacing:.06em;
    background:rgba(255,255,255,.06); padding:9px 18px; border-radius:22px;
    border:1px solid rgba(255,255,255,.10);
  }
  .hint b { color:#ffd98a; }
  .fab {
    position:fixed; bottom:18px; z-index:99; cursor:pointer;
    background:rgba(0,0,0,.62); color:#ffd966; padding:9px 15px; border-radius:22px;
    font-size:14px; font-weight:600; box-shadow:0 4px 16px rgba(0,0,0,.4);
  }
  #bgm-hint { right:18px; }
  #lamp-btn { left:18px; }
  #sky-btn { left:18px; bottom:64px; }
</style>
</head>
<body>
<canvas id="ambient"></canvas>
<h1>"Merry Christmas" from XS</h1>
<div class="wrap">
  <div class="globe" id="globe">
    <div class="ball" id="ball">
      <canvas id="skycv"></canvas>
      <div class="scene" id="scene">
        <svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMax meet">
          <defs>
            <linearGradient id="snowGradBack" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop id="gb-stop0" offset="0%" stop-color="#b4c4d8"/>
              <stop id="gb-stop1" offset="55%" stop-color="#8b9db4"/>
              <stop id="gb-stop2" offset="100%" stop-color="#66788e"/>
            </linearGradient>
            <linearGradient id="snowGradFront" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop id="gf-stop0" offset="0%" stop-color="#c2cfe0"/>
              <stop id="gf-stop1" offset="52%" stop-color="#9db0c7"/>
              <stop id="gf-stop2" offset="100%" stop-color="#77899f"/>
            </linearGradient>
          </defs>
          <ellipse id="snow-ground-skirt" cx="100" cy="190" rx="84" ry="12" fill="url(#snowGradBack)"/>
          <ellipse id="snow-ground-back" cx="100" cy="178" rx="80" ry="15" fill="url(#snowGradBack)"/>
          <ellipse id="snow-ground-front" cx="100" cy="174" rx="68" ry="11" fill="url(#snowGradFront)"/>
        </svg>
        <canvas id="auroracv"></canvas>
        <canvas id="treecv"></canvas>
        <canvas id="snow"></canvas>
      </div>
      <canvas id="fogcv"></canvas>
      <canvas id="glasscv"></canvas>
      <div class="glare"></div>
      <div class="glare2"></div>
    </div>
    <div class="base-halo" id="base-halo"></div>
    <div class="base"><div class="plate">MERRY CHRISTMAS</div></div>
  </div>
  <div class="hint">🫧 <b>摇一摇 / 点一点球</b> 下大雪·积雪变厚</div>
</div>
<div id="sky-btn" class="fab">🌗 极夜</div>
<div id="lamp-btn" class="fab">💡 灯色</div>
<div id="bgm-hint" class="fab">🔊 点击开启音乐</div>
<audio id="bgm" src="bgm2.mp3" loop muted preload="auto"></audio>
<script>
(function(){
  var ball=document.getElementById('ball'), cv=document.getElementById('snow'), ctx=cv.getContext('2d');
  var sceneEl=document.getElementById('scene');
  var skycv=document.getElementById('skycv'), sctx=skycv.getContext('2d');
  var fogcv=document.getElementById('fogcv'), fctx=fogcv.getContext('2d');
  var glasscv=document.getElementById('glasscv'), gctx=glasscv.getContext('2d');
  var skyBlurLayer=document.createElement('canvas'); skyBlurLayer.width=112; skyBlurLayer.height=112;
  var sbctx=skyBlurLayer.getContext('2d');
  var horizonMistLayer=document.createElement('canvas'); horizonMistLayer.width=160; horizonMistLayer.height=48;
  var hmctx=horizonMistLayer.getContext('2d');
  var W=0,H=0,CX=0,CY=0,R=0, flakes=[], boost=0, lamps=[], accum=0.35, lampMode=0, lastRedraw=0;
  var chimneys=[], windows=[], smokes=[], snowmanProg=0, snowmanTarget=0, hatProg=0, lastTreeAccum=accum;
  var acv=document.getElementById('auroracv'), actx=acv.getContext('2d');
  var auroraDofLayer=document.createElement('canvas'), adctx=auroraDofLayer.getContext('2d');
  var auroraDofBlur=document.createElement('canvas'), adbCtx=auroraDofBlur.getContext('2d');
  var tcv=document.getElementById('treecv'), tctx=tcv.getContext('2d');
  var treeLayer=document.createElement('canvas'), tlctx=treeLayer.getContext('2d');
  var mountainLayer=document.createElement('canvas'), mlctx=mountainLayer.getContext('2d');
  var mountainBlurA=document.createElement('canvas'), mbaCtx=mountainBlurA.getContext('2d');
  var mountainBlurB=document.createElement('canvas'), mbbCtx=mountainBlurB.getContext('2d');
  var snowTexLayer=document.createElement('canvas'), stctx=snowTexLayer.getContext('2d');
  var snowmanAoLayer=document.createElement('canvas'), smAoCtx=snowmanAoLayer.getContext('2d');
  var snowmanBodyAoLayer=document.createElement('canvas'), smBodyAoCtx=snowmanBodyAoLayer.getContext('2d');
  var snowmanAoSpec={s:0, gw:0, gh:0, bw:0, bh:0};
  var groundBack=document.getElementById('snow-ground-back'), groundFront=document.getElementById('snow-ground-front');
  var gbStops=[document.getElementById('gb-stop0'),document.getElementById('gb-stop1'),document.getElementById('gb-stop2')];
  var gfStops=[document.getElementById('gf-stop0'),document.getElementById('gf-stop1'),document.getElementById('gf-stop2')];
  var skirtPuffs=[], houseSpecs=[], giftSpecs=[], lampSpec=null, shakeStart=-9999, shakeActive=false;
  var audioCtx=null, analyser=null, freqData=null, audioInited=false;
  var musicBass=0, musicEnergy=0, auroraPhase=0, lastTickNow=0;
  var meteor={active:false, start:0, dur:850, nextAt:0, x0:0, y0:0, dx:0, dy:0};
  var footprintAlpha=0, footprintReveal=0, footprintActive=false, prevAccum=accum;
  var squirrel={offset:0, target:0, dir:1, nextAt:0};
  var giftStates=[], giftParticles=[], giftLabels=[], MAX_GIFT_PARTICLES=24;
  var auroraStormMix=0, snowmanBlinkAt=0, snowmanBlinkUntil=0;
  var snowmanOutfits=[
    {hat:'#222630', band:'#c92a2a', scarf:'#c92a2a', tail:'#b02020'},
    {hat:'#1d4d3a', band:'#f2c94c', scarf:'#236b4e', tail:'#184f39'},
    {hat:'#1f3a6e', band:'#ffd75e', scarf:'#2b549e', tail:'#1e3d78'}
  ];
  var snowmanOutfit=0, snowmanBounceStart=-9999, snowmanBounceActive=false, SNOWMAN_BOUNCE_DUR=380;
  var fogLevel=1, fogGrad=null, lastFogOp=-1;
  var snowSwirl=0;
  var lightRain=[], MAX_LIGHT_RAIN=5;
  var treePulseStart=-9999, treePulseActive=false, TREE_PULSE_DUR=520;
  var baseHalo=document.getElementById('base-halo');
  var skyMode=0, skyTransActive=false;
  var SKY_NAMES=['极夜','黄昏','黎明'];
  var SKY_THEMES=[
    { // 0: 极夜（冷蓝）
      skyTop:[10,21,38], skyUpper:[22,38,63], skyHoriz:[44,68,100], skyLow:[23,38,60], skyBot:[6,10,18],
      glowCol:[150,190,235], glowA:0.18, cloudCol:[112,148,196], cloudA:0.14,
      mistCol:[118,158,208], mistA:0.26,
      gb0:[180,196,216], gb1:[139,157,180], gb2:[102,120,142],
      gf0:[194,207,224], gf1:[157,176,199], gf2:[119,137,159],
      skTop:[194,207,224], skMid:[159,177,199], skBot:[119,137,159],
      treeTint:[136,170,224], treeTintA:0,
      bodyTop:[30,50,80], bodyMid:[16,26,40], bodyBot:[6,10,18],
      moonVis:0.92, auroraVis:1.0, starVis:1.0, duskMix:0, dawnMix:0
    },
    { // 1: 黄昏（橙紫暖调）
      skyTop:[28,22,58], skyUpper:[78,44,92], skyHoriz:[194,104,88], skyLow:[86,48,74], skyBot:[22,14,34],
      glowCol:[255,166,104], glowA:0.32, cloudCol:[226,132,126], cloudA:0.22,
      mistCol:[214,142,148], mistA:0.30,
      gb0:[218,196,210], gb1:[168,142,166], gb2:[116,94,120],
      gf0:[228,208,220], gf1:[184,158,182], gf2:[132,110,136],
      skTop:[228,208,220], skMid:[184,158,182], skBot:[132,110,136],
      treeTint:[235,146,120], treeTintA:0.12,
      bodyTop:[58,34,68], bodyMid:[28,18,38], bodyBot:[11,7,18],
      moonVis:0.42, auroraVis:0.34, starVis:0.48, duskMix:1, dawnMix:0
    },
    { // 2: 黎明（淡青冷调）
      skyTop:[22,52,82], skyUpper:[58,108,140], skyHoriz:[144,198,214], skyLow:[62,98,124], skyBot:[20,38,56],
      glowCol:[196,238,248], glowA:0.28, cloudCol:[170,218,232], cloudA:0.22,
      mistCol:[168,214,228], mistA:0.30,
      gb0:[210,228,238], gb1:[160,188,202], gb2:[114,144,162],
      gf0:[220,236,244], gf1:[174,200,214], gf2:[128,158,176],
      skTop:[220,236,244], skMid:[174,200,214], skBot:[128,158,176],
      treeTint:[168,224,240], treeTintA:0.10,
      bodyTop:[32,64,88], bodyMid:[16,35,52], bodyBot:[7,16,26],
      moonVis:0.26, auroraVis:0.28, starVis:0.28, duskMix:0, dawnMix:1
    }
  ];
  function cloneTheme(src){
    var out={};
    for(var k in src){
      out[k]=Array.isArray(src[k])? src[k].slice() : src[k];
    }
    return out;
  }
  var skyState=cloneTheme(SKY_THEMES[0]);
  var tiltX=0, tiltY=0, tiltRot=0, tiltXTarget=0, tiltYTarget=0, tiltRotTarget=0;
  var sceneZoom=1, sceneZoomTarget=1, lastTransformStr='';
  var seed=7;
  function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
  function lerpRgbArr(cur, dst, t){
    cur[0]+=(dst[0]-cur[0])*t; cur[1]+=(dst[1]-cur[1])*t; cur[2]+=(dst[2]-cur[2])*t;
  }
  function rgbStr(a, alpha){
    var r=Math.round(a[0]), g=Math.round(a[1]), b=Math.round(a[2]);
    return alpha===undefined? ('rgb('+r+','+g+','+b+')') : ('rgba('+r+','+g+','+b+','+alpha+')');
  }
  function drawSkyBackdrop(){
    var SW=skyBlurLayer.width, SH=skyBlurLayer.height;
    var g=sbctx.createLinearGradient(0,0,0,SH);
    g.addColorStop(0.00, rgbStr(skyState.skyTop));
    g.addColorStop(0.36, rgbStr(skyState.skyUpper));
    g.addColorStop(0.68, rgbStr(skyState.skyHoriz));
    g.addColorStop(0.84, rgbStr(skyState.skyLow));
    g.addColorStop(1.00, rgbStr(skyState.skyBot));
    sbctx.fillStyle=g;
    sbctx.fillRect(0,0,SW,SH);
    // 多层柔和模糊大气光斑，模拟 polar 的 backgroundBlurriness=0.55
    var g2=sbctx.createRadialGradient(SW*0.28,SH*0.36,4,SW*0.28,SH*0.36,SW*0.72);
    g2.addColorStop(0, rgbStr(skyState.glowCol, skyState.glowA.toFixed(3)));
    g2.addColorStop(0.55, rgbStr(skyState.glowCol, (skyState.glowA*0.38).toFixed(3)));
    g2.addColorStop(1, rgbStr(skyState.glowCol, 0));
    sbctx.fillStyle=g2;
    sbctx.fillRect(0,0,SW,SH);
    var g3=sbctx.createRadialGradient(SW*0.66,SH*0.64,4,SW*0.66,SH*0.64,SW*0.62);
    g3.addColorStop(0, rgbStr(skyState.cloudCol, skyState.cloudA.toFixed(3)));
    g3.addColorStop(0.6, rgbStr(skyState.cloudCol, (skyState.cloudA*0.35).toFixed(3)));
    g3.addColorStop(1, rgbStr(skyState.cloudCol, 0));
    sbctx.fillStyle=g3;
    sbctx.fillRect(0,0,SW,SH);
    if(W>0 && H>0){
      sctx.clearRect(0,0,W,H);
      sctx.imageSmoothingEnabled=true;
      sctx.drawImage(skyBlurLayer,0,0,W,H);
    }
  }
  function buildHorizonMist(){
    var MW=horizonMistLayer.width, MH=horizonMistLayer.height;
    hmctx.clearRect(0,0,MW,MH);
    var hg=hmctx.createLinearGradient(0,0,MW,0);
    var ma=skyState.mistA;
    hg.addColorStop(0.00, rgbStr(skyState.mistCol, 0));
    hg.addColorStop(0.22, rgbStr(skyState.mistCol, (ma*0.85).toFixed(3)));
    hg.addColorStop(0.50, rgbStr(skyState.mistCol, ma.toFixed(3)));
    hg.addColorStop(0.78, rgbStr(skyState.mistCol, (ma*0.85).toFixed(3)));
    hg.addColorStop(1.00, rgbStr(skyState.mistCol, 0));
    hmctx.fillStyle=hg;
    hmctx.fillRect(0,0,MW,MH);
    hmctx.save();
    hmctx.globalCompositeOperation='destination-in';
    var vg=hmctx.createLinearGradient(0,0,0,MH);
    vg.addColorStop(0.00, 'rgba(255,255,255,0)');
    vg.addColorStop(0.42, 'rgba(255,255,255,0.92)');
    vg.addColorStop(0.70, 'rgba(255,255,255,0.72)');
    vg.addColorStop(1.00, 'rgba(255,255,255,0)');
    hmctx.fillStyle=vg;
    hmctx.fillRect(0,0,MW,MH);
    hmctx.restore();
  }
  function applySkyThemeToDOM(){
    if(gbStops[0]) gbStops[0].setAttribute('stop-color', rgbStr(skyState.gb0));
    if(gbStops[1]) gbStops[1].setAttribute('stop-color', rgbStr(skyState.gb1));
    if(gbStops[2]) gbStops[2].setAttribute('stop-color', rgbStr(skyState.gb2));
    if(gfStops[0]) gfStops[0].setAttribute('stop-color', rgbStr(skyState.gf0));
    if(gfStops[1]) gfStops[1].setAttribute('stop-color', rgbStr(skyState.gf1));
    if(gfStops[2]) gfStops[2].setAttribute('stop-color', rgbStr(skyState.gf2));
    document.body.style.background='radial-gradient(ellipse at 50% 18%, '+rgbStr(skyState.bodyTop)+' 0%, '+rgbStr(skyState.bodyMid)+' 48%, '+rgbStr(skyState.bodyBot)+' 100%)';
  }
  function drawGlassLayer(){
    gctx.clearRect(0,0,W,H);
    gctx.save();
    gctx.beginPath(); gctx.arc(CX,CY,R,0,6.2832); gctx.clip();
    // 内壁淡蓝折射高光环（Fresnel 菲涅尔内壁折射感）
    var ir=gctx.createRadialGradient(CX,CY,R*0.76,CX,CY,R);
    ir.addColorStop(0,'rgba(176,214,250,0)');
    ir.addColorStop(0.58,'rgba(176,214,250,0.06)');
    ir.addColorStop(0.86,'rgba(202,230,255,0.20)');
    ir.addColorStop(0.96,'rgba(225,242,255,0.26)');
    ir.addColorStop(1.00,'rgba(148,196,245,0.08)');
    gctx.fillStyle=ir;
    gctx.fillRect(0,0,W,H);
    // 左上来光方向环境反射亮弧
    var arcR=R-Math.max(3,W*0.011);
    var hiG=gctx.createLinearGradient(CX-R*0.88,CY-R*0.88,CX+R*0.20,CY+R*0.20);
    hiG.addColorStop(0,'rgba(235,247,255,0.42)');
    hiG.addColorStop(0.45,'rgba(196,226,255,0.22)');
    hiG.addColorStop(1,'rgba(196,226,255,0)');
    gctx.lineCap='round';
    gctx.strokeStyle=hiG;
    gctx.lineWidth=Math.max(4,W*0.022);
    gctx.beginPath(); gctx.arc(CX,CY,arcR,Math.PI*0.92,Math.PI*1.58); gctx.stroke();
    gctx.strokeStyle='rgba(255,255,255,0.34)';
    gctx.lineWidth=Math.max(1.2,W*0.005);
    gctx.beginPath(); gctx.arc(CX,CY,R-Math.max(1.8,W*0.006),Math.PI*1.00,Math.PI*1.50); gctx.stroke();
    // 右下暗弧（玻璃球厚度与环境背光暗边）
    var dkG=gctx.createLinearGradient(CX-R*0.15,CY-R*0.15,CX+R*0.90,CY+R*0.90);
    dkG.addColorStop(0,'rgba(8,16,30,0)');
    dkG.addColorStop(0.55,'rgba(10,18,32,0.28)');
    dkG.addColorStop(1,'rgba(6,12,24,0.44)');
    gctx.strokeStyle=dkG;
    gctx.lineWidth=Math.max(5,W*0.028);

  function buildDistantMountains(){
    mlctx.clearRect(0,0,W,H);
    mlctx.save();
    var ridges=[
      {
        pts:[[-0.06,0.84],[0.02,0.83],[0.13,0.68],[0.24,0.74],[0.35,0.61],[0.46,0.70],[0.56,0.63],[0.69,0.73],[0.81,0.62],[0.92,0.71],[1.06,0.83]],
        topCol:'rgba(34,54,84,0.56)', botCol:'rgba(16,26,40,0.18)', rimCol:'rgba(182,210,245,0.11)', baseY:0.89
      },
      {
        pts:[[-0.06,0.87],[0.00,0.86],[0.10,0.74],[0.21,0.79],[0.31,0.69],[0.44,0.77],[0.58,0.71],[0.71,0.78],[0.84,0.69],[0.95,0.77],[1.06,0.86]],
        topCol:'rgba(24,40,64,0.62)', botCol:'rgba(16,26,40,0.22)', rimCol:'rgba(168,198,236,0.10)', baseY:0.90
      }
    ];
    for(var ri=0;ri<ridges.length;ri++){
      var rg=ridges[ri], pts=rg.pts;
      var grd=mlctx.createLinearGradient(0,H*0.60,0,H*rg.baseY);
      grd.addColorStop(0,rg.topCol);
      grd.addColorStop(0.65,rg.topCol);
      grd.addColorStop(1,rg.botCol);
      mlctx.fillStyle=grd;
      mlctx.beginPath();
      mlctx.moveTo(pts[0][0]*W, H*rg.baseY);
      for(var pi=0;pi<pts.length;pi++){
        mlctx.lineTo(pts[pi][0]*W, pts[pi][1]*H);
      }
      mlctx.lineTo(pts[pts.length-1][0]*W, H*rg.baseY);
      mlctx.closePath();
      mlctx.fill();
      mlctx.strokeStyle=rg.rimCol;
      mlctx.lineWidth=Math.max(1.2, W*0.005);
      mlctx.beginPath();
      for(var pj=0;pj<pts.length;pj++){
        if(pj===0) mlctx.moveTo(pts[pj][0]*W, pts[pj][1]*H);
        else mlctx.lineTo(pts[pj][0]*W, pts[pj][1]*H);
      }
      mlctx.stroke();
    }
    // 静态离屏多级缩小放大实现镜头景深(DOF)模糊，避免每帧 filter
    mbaCtx.clearRect(0,0,mountainBlurA.width,mountainBlurA.height);
    mbaCtx.imageSmoothingEnabled=true;
    mbaCtx.drawImage(mountainLayer,0,0,mountainBlurA.width,mountainBlurA.height);
    mbbCtx.clearRect(0,0,mountainBlurB.width,mountainBlurB.height);
    mbbCtx.imageSmoothingEnabled=true;
    mbbCtx.drawImage(mountainBlurA,0,0,mountainBlurB.width,mountainBlurB.height);
    mlctx.clearRect(0,0,W,H);
    mlctx.imageSmoothingEnabled=true;
    mlctx.globalAlpha=0.82;
    mlctx.drawImage(mountainBlurB,0,0,W,H);
    mlctx.globalAlpha=0.26;
    mlctx.drawImage(mountainBlurA,0,0,W,H);
    mlctx.globalAlpha=1;
    var mist=mlctx.createLinearGradient(0,H*0.72,0,H*0.90);
    mist.addColorStop(0,'rgba(24,40,64,0)');
    mist.addColorStop(0.55,'rgba(22,38,62,0.24)');
    mist.addColorStop(1,'rgba(16,26,40,0)');
    mlctx.fillStyle=mist;
    mlctx.fillRect(0,H*0.72,W,H*0.20);
    // 水平边缘柔化，避免缩放至 0.85 或倾斜时出现切边
    mlctx.globalCompositeOperation='destination-in';
    var edgeF=mlctx.createLinearGradient(0,0,W,0);
    edgeF.addColorStop(0,'rgba(255,255,255,0)');
    edgeF.addColorStop(0.12,'rgba(255,255,255,1)');
    edgeF.addColorStop(0.88,'rgba(255,255,255,1)');
    edgeF.addColorStop(1,'rgba(255,255,255,0)');
    mlctx.fillStyle=edgeF;
    mlctx.fillRect(0,0,W,H);
    mlctx.restore();
  }

  function buildSnowmanAo(){
    var s=H*0.60*0.095, r1=s*0.36;
    var gw=Math.max(8, Math.ceil(s*1.4)), gh=Math.max(6, Math.ceil(s*0.42));
    var bw=Math.max(8, Math.ceil(r1*2.4)), bh=Math.max(8, Math.ceil(r1*2.4));
    snowmanAoLayer.width=gw; snowmanAoLayer.height=gh;
    snowmanBodyAoLayer.width=bw; snowmanBodyAoLayer.height=bh;
    snowmanAoSpec={s:s, gw:gw, gh:gh, bw:bw, bh:bh};
    // 1) 雪人底部接地 AO（离屏缓存，避免每帧重算渐变）
    smAoCtx.clearRect(0,0,gw,gh);
    smAoCtx.save();
    smAoCtx.translate(gw*0.5, gh*0.5);
    var rx=s*0.56, ry=s*0.145;
    smAoCtx.scale(1, ry/rx);
    var gAo=smAoCtx.createRadialGradient(0,0,rx*0.08,0,0,rx);
    gAo.addColorStop(0,'rgba(10,18,32,0.52)');
    gAo.addColorStop(0.45,'rgba(12,22,38,0.30)');
    gAo.addColorStop(1,'rgba(16,26,40,0)');
    smAoCtx.fillStyle=gAo;
    smAoCtx.beginPath(); smAoCtx.arc(0,0,rx,0,6.2832); smAoCtx.fill();
    smAoCtx.restore();
    // 2) 雪人下雪球底部柔和自遮蔽暗部（离屏缓存）
    smBodyAoCtx.clearRect(0,0,bw,bh);
    smBodyAoCtx.save();
    smBodyAoCtx.translate(bw*0.5, bh*0.5);
    smBodyAoCtx.beginPath(); smBodyAoCtx.arc(0,0,r1,0,6.2832); smBodyAoCtx.clip();
    var bAo=smBodyAoCtx.createLinearGradient(0, r1*0.20, 0, r1);
    bAo.addColorStop(0,'rgba(12,22,38,0)');
    bAo.addColorStop(0.55,'rgba(12,22,38,0.16)');
    bAo.addColorStop(1,'rgba(8,16,30,0.40)');
    smBodyAoCtx.fillStyle=bAo;
    smBodyAoCtx.fillRect(-r1,-r1,r1*2,r1*2);
    smBodyAoCtx.restore();
  }

  function buildSnowSpeckles(){
    stctx.clearRect(0,0,W,H);
    stctx.save();
    stctx.beginPath();
    stctx.ellipse(CX, H*0.882, W*0.415, H*0.092, 0, 0, 6.2832);
    stctx.clip();
    var s=97;
    function srnd(){ s=(s*9301+49297)%233280; return s/233280; }
    var sc=Math.max(0.6, W/400);
    // 轻微雪坡纹理起伏斑块
    for(var i=0;i<26;i++){
      var bx=CX+(srnd()-0.5)*W*0.78;
      var by=H*0.82+srnd()*H*0.14;
      var brx=(8+srnd()*18)*sc, bry=(2+srnd()*4.5)*sc;
      stctx.fillStyle=(i%2===0)?'rgba(194,207,224,0.08)':'rgba(16,26,40,0.07)';
      stctx.beginPath(); stctx.ellipse(bx,by,brx,bry,0,0,6.2832); stctx.fill();
    }
    // 细噪声斑点（亮雪晶 + 暗微粒）
    var count=Math.min(420, Math.max(200, Math.round(W*0.95)));
    for(var k=0;k<count;k++){
      var sx=CX+(srnd()-0.5)*W*0.80;
      var sy=H*0.805+srnd()*H*0.16;
      var r=(0.55+srnd()*1.15)*sc;
      var isBright=(srnd()>0.46);
      stctx.fillStyle=isBright
        ? ('rgba(214,230,251,'+(0.06+srnd()*0.11).toFixed(3)+')')
        : ('rgba(58,76,100,'+(0.06+srnd()*0.10).toFixed(3)+')');
      stctx.beginPath(); stctx.arc(sx,sy,r,0,6.2832); stctx.fill();
    }
    stctx.restore();
  }

  // ========== 照真实照片绘制的圣诞树 ==========
  function drawTree(){
    seed=7;
    lastTreeAccum=accum;
    chimneys.length=0;
    windows.length=0;
    skirtPuffs.length=0;
    updateGroundSnow();
    tlctx.clearRect(0,0,W,H);
    var cx=W/2, baseY=H*0.875, treeH=H*0.60;
    // 小房子参数与烟囱/窗户记录
    houseSpecs=[
      {x:cx-treeH*0.56, y:baseY-treeH*0.005, s:treeH*0.17},
      {x:cx+treeH*0.55, y:baseY+treeH*0.01, s:treeH*0.13}
    ];
    for(var hi=0;hi<houseSpecs.length;hi++){
      var hs=houseSpecs[hi];
      chimneys.push({x:hs.x+hs.s*0.32, y:hs.y-hs.s*0.98, s:hs.s});
      var wx1=hs.x-hs.s*0.30, wx2=hs.x+hs.s*0.08, wy=hs.y-hs.s*0.42, ww=hs.s*0.22;
      windows.push({x:wx1,y:wy,w:ww,h:ww},{x:wx2,y:wy,w:ww,h:ww});
    }
    lampSpec={x:cx-treeH*0.475, y:baseY+treeH*0.032, h:treeH*0.18};
    // 树裙绒球随机种子（保持后续随机数一致）
    for(var i=0;i<30;i++){ skirtPuffs.push({a:i/30*6.2832, r:2.5+rnd()*2}); }
    // 礼物堆 8 盒参数
    giftSpecs=[
      {x:cx-treeH*0.34, y:baseY-treeH*0.005, w:treeH*0.14, h:treeH*0.10, c1:'#a8202a', c2:'#ffd75e'},
      {x:cx-treeH*0.13, y:baseY+treeH*0.025, w:treeH*0.17, h:treeH*0.115, c1:'#c9a227', c2:'#8c1c1c'},
      {x:cx+treeH*0.18, y:baseY+treeH*0.005, w:treeH*0.13, h:treeH*0.095, c1:'#274b8f', c2:'#e8e8e8'},
      {x:cx+treeH*0.03, y:baseY-treeH*0.05, w:treeH*0.10, h:treeH*0.075, c1:'#7a1f2b', c2:'#e8c15a'},
      {x:cx-treeH*0.23, y:baseY+treeH*0.045, w:treeH*0.12, h:treeH*0.085, c1:'#1f6b4a', c2:'#ffd75e'},
      {x:cx+treeH*0.31, y:baseY+treeH*0.03, w:treeH*0.11, h:treeH*0.08, c1:'#8e44ad', c2:'#f5f5f5'},
      {x:cx-treeH*0.02, y:baseY+treeH*0.055, w:treeH*0.15, h:treeH*0.10, c1:'#b03a2e', c2:'#f7dc6f'},
      {x:cx+treeH*0.11, y:baseY+treeH*0.05, w:treeH*0.09, h:treeH*0.07, c1:'#16a085', c2:'#ffd75e'}
    ];
    while(giftStates.length<giftSpecs.length) giftStates.push({target:0, prog:0});
    // 浓密锥体 + 挂雪（缓存到 treeLayer）
    var tiers=6;
    for(var L=tiers-1;L>=0;L--){
      var t=L/(tiers-1);
      var topY=baseY-treeH*0.10-(1-t)*treeH*0.80-treeH*0.22;
      var halfW=treeH*0.13+t*treeH*0.31;
      var lh=treeH*0.36;
      // 上层树冠投射到下层树冠顶部的环境光遮蔽(AO)
      if(L<tiers-1){
        tlctx.save();
        tlctx.globalCompositeOperation='source-atop';
        var aoCy=topY+lh*0.95, aoRx=halfW*0.98, aoRy=lh*0.24;
        tlctx.translate(cx, aoCy);
        tlctx.scale(1, aoRy/aoRx);
        var tierAo=tlctx.createRadialGradient(0,0,aoRx*0.10,0,0,aoRx);
        tierAo.addColorStop(0,'rgba(8,14,26,0.44)');
        tierAo.addColorStop(0.58,'rgba(10,18,32,0.22)');
        tierAo.addColorStop(1,'rgba(12,22,36,0)');
        tlctx.fillStyle=tierAo;
        tlctx.beginPath(); tlctx.arc(0,0,aoRx,0,6.2832); tlctx.fill();
        tlctx.restore();
      }
      drawSolidTier(cx,topY,halfW,lh,L);
    }
    // 外伸下垂枝
    var tiers2=6;
    for(var L2=0;L2<tiers2;L2++){
      var t2=L2/(tiers2-1);
      var y2=baseY-treeH*0.06-(1-t2)*treeH*0.84;
      var spread=treeH*0.12+t2*treeH*0.34;
      var nB=2+Math.round(t2*3);
      for(var s=-1;s<=1;s+=2){
        for(var b=0;b<nB;b++){
          var fr=(b+0.7)/nB;
          var ang=s*(0.7+0.5*fr)+(rnd()-0.5)*0.2;
          var len=spread*(0.35+0.35*fr)*(0.8+rnd()*0.4);
          var droop=(0.25+0.5*t2)*len*0.5;
          drawBranch(cx+s*spread*0.55, y2+treeH*0.05, ang*0.5, len, droop, t2);
        }
      }
    }
    // 灯串位置（闪烁在 tick 画）
    lamps.length=0;
    for(var i2=0;i2<52;i2++){
      var u=rnd();
      var yy=baseY-treeH*0.06-u*treeH*0.86;
      var halfW2=(treeH*0.36*(1-u)+treeH*0.06)*0.85;
      var xx=cx+(rnd()-0.5)*2*halfW2;
      lamps.push({x:xx,y:yy,u:u,r:1.5+rnd()*1.3, sp:2+rnd()*4, ph:rnd()*6.28, ci:(rnd()*5)|0});
    }
    // 天使顶
    angel(cx, baseY-treeH*0.98, treeH*0.085);
    renderTreeScene(shakeActive? Math.max(0, performance.now()-shakeStart) : 0, 0);
  }
  function applyTreeSway(targetCtx, ang){
    if(!ang) return;
    targetCtx.translate(W/2, H*0.875);
    targetCtx.rotate(ang);
    targetCtx.translate(-W/2, -H*0.875);

  function renderTreeScene(shakeElapsed, treeSwayAng){
    tctx.clearRect(0,0,W,H);
    var cx=W/2, baseY=H*0.875, treeH=H*0.60;
    var g0=tctx.createRadialGradient(cx,baseY-treeH*0.45,6,cx,baseY-treeH*0.45,treeH*0.92);
    g0.addColorStop(0, rgbStr(skyState.glowCol, (0.20+0.06*skyState.duskMix+0.04*skyState.dawnMix).toFixed(3)));
    g0.addColorStop(0.5, rgbStr(skyState.cloudCol, 0.09));
    g0.addColorStop(1,'rgba(16,26,40,0)');
    tctx.fillStyle=g0; tctx.fillRect(0,0,W,H);
    tctx.drawImage(snowTexLayer,0,0);
    var ex=Math.max(0,(accum-0.35)/0.65);
    // 雪地上的树柔和倒影（垂直压扁 + 错位双层半透明模拟模糊）
    tctx.save();
    tctx.beginPath();
    tctx.ellipse(cx, H*(0.89-ex*0.011), W*(0.40+ex*0.03), H*(0.075+ex*0.022), 0, 0, 6.2832);
    tctx.clip();
    tctx.save();
    tctx.translate(0, baseY+treeH*0.015);
    tctx.scale(1, -0.18);
    tctx.translate(0, -baseY);
    tctx.globalAlpha=0.042;
    tctx.drawImage(treeLayer, -2, 0);
    tctx.drawImage(treeLayer, 2, 0);
    tctx.restore();
    var refFade=tctx.createLinearGradient(0, baseY-treeH*0.02, 0, H*0.98);
    refFade.addColorStop(0, rgbStr(skyState.skMid, 0));
    refFade.addColorStop(1, rgbStr(skyState.skBot, 0.52));
    tctx.fillStyle=refFade;
    tctx.fillRect(cx-W*0.45, baseY-treeH*0.03, W*0.90, H*0.18);
    tctx.restore();
    var wob=0, p=0;
    if(shakeElapsed>0 && shakeElapsed<500){
      p=shakeElapsed/500;
      wob=(1-p)*(1-p);
    }
    for(var hi=0;hi<houseSpecs.length;hi++){
      var hs=houseSpecs[hi];
      house(hs.x, hs.y, hs.s, wob, hi, p);
    }
    if(lampSpec){
      drawStreetLampPost(lampSpec.x, lampSpec.y, lampSpec.h, wob, p);
    }
    // 毛绒树裙（随昼夜主题平滑过渡色调，厚度/半径随 accum 微调）
    var rx=treeH*(0.44+0.045*ex), ry=treeH*(0.075+0.028*ex), sy=baseY+treeH*(0.015-0.008*ex);
    var skGrd=tctx.createLinearGradient(0,sy-ry,0,sy+ry);
    skGrd.addColorStop(0, rgbStr(skyState.skTop));
    skGrd.addColorStop(0.55, rgbStr(skyState.skMid));
    skGrd.addColorStop(1, rgbStr(skyState.skBot));
    tctx.fillStyle=skGrd;
    tctx.beginPath(); tctx.ellipse(cx,sy,rx,ry,0,0,6.2832); tctx.fill();
    if(ex>0.05){
      var skTop=tctx.createLinearGradient(0,sy-ry*0.90,0,sy+ry*0.54);
      skTop.addColorStop(0, rgbStr(skyState.gf0, (0.38+0.34*ex).toFixed(3)));
      skTop.addColorStop(1, rgbStr(skyState.skMid, (0.18+0.20*ex).toFixed(3)));
      tctx.fillStyle=skTop;
      tctx.beginPath(); tctx.ellipse(cx,sy-ry*0.18,rx*0.86,ry*0.72,0,0,6.2832); tctx.fill();
    }
    var puffTop=rgbStr(skyState.skTop, 0.92), puffBot=rgbStr(skyState.skBot, 0.90);
    for(var i=0;i<skirtPuffs.length;i++){
      var sp=skirtPuffs[i], pyNorm=Math.sin(sp.a);
      tctx.fillStyle=pyNorm<0 ? puffTop : puffBot;
      tctx.beginPath();
      tctx.arc(cx+rx*Math.cos(sp.a), sy+ry*pyNorm, sp.r*(1+0.42*ex),0,6.2832);
      tctx.fill();
    }
    // 树冠最底层投射在树裙上的接地环境光遮蔽(AO)
    var trAoRx=treeH*0.40, trAoRy=treeH*0.072;
    tctx.save();
    tctx.translate(cx, baseY-treeH*0.015);
    tctx.scale(1, trAoRy/trAoRx);
    var trAoG=tctx.createRadialGradient(0,0,trAoRx*0.12,0,0,trAoRx);
    trAoG.addColorStop(0,'rgba(8,14,26,0.36)');
    trAoG.addColorStop(0.55,'rgba(12,20,34,0.16)');
    trAoG.addColorStop(1,'rgba(16,26,40,0)');
    tctx.fillStyle=trAoG;
    tctx.beginPath(); tctx.arc(0,0,trAoRx,0,6.2832); tctx.fill();

  function gift(x,y,w,h,c1,c2,wob,idx,p,openProg){
    tctx.save();
    if(wob>0){
      var osc=Math.sin(p*20.4+idx*1.15);
      tctx.translate(x+wob*osc*2.0, y);
      tctx.rotate(wob*osc*0.085);
      tctx.translate(-x, -y);
    }
    // 礼物盒底部接地环境光遮蔽(AO)
    var gAoRx=w*0.66, gAoRy=h*0.155;
    tctx.save();
    tctx.translate(x, y+h*0.025);
    tctx.scale(1, gAoRy/gAoRx);
    var gAo=tctx.createRadialGradient(0,0,gAoRx*0.12,0,0,gAoRx);
    gAo.addColorStop(0,'rgba(8,14,26,0.48)');
    gAo.addColorStop(0.55,'rgba(12,22,38,0.20)');
    gAo.addColorStop(1,'rgba(16,26,40,0)');
    tctx.fillStyle=gAo;
    tctx.beginPath(); tctx.arc(0,0,gAoRx,0,6.2832); tctx.fill();
    tctx.restore();
    var boxAo=tctx.createLinearGradient(0,y-h*0.24,0,y);
    boxAo.addColorStop(0,'rgba(8,14,24,0)');
    boxAo.addColorStop(1,'rgba(8,14,24,0.32)');
    var op=openProg||0;
    if(op<=0.001){
      tctx.fillStyle=c1; tctx.fillRect(x-w/2,y-h,w,h);
      tctx.fillStyle='rgba(0,0,0,0.18)'; tctx.fillRect(x-w/2,y-h,w,h*0.22);
      tctx.fillStyle=c2; tctx.fillRect(x-w*0.08,y-h,w*0.16,h); tctx.fillRect(x-w/2,y-h*0.58,w,h*0.16);
      tctx.fillStyle=boxAo; tctx.fillRect(x-w/2,y-h*0.24,w,h*0.24);
      tctx.fillStyle=c2;
      tctx.beginPath(); tctx.arc(x-w*0.10,y-h-h*0.10,w*0.09,0,6.2832); tctx.arc(x+w*0.10,y-h-h*0.10,w*0.09,0,6.2832); tctx.fill();
      tctx.restore();
      return;
    }
    // 盒身与内部暖光
    var bodyH=h*0.78, lidH=h*0.22;
    tctx.fillStyle=c1; tctx.fillRect(x-w/2,y-bodyH,w,bodyH);
    tctx.fillStyle='#2a1a14'; tctx.fillRect(x-w*0.44,y-bodyH,w*0.88,h*0.09);
    tctx.fillStyle='rgba(255,225,130,'+(0.55*op).toFixed(3)+')';
    tctx.fillRect(x-w*0.40,y-bodyH,w*0.80,h*0.07);
    tctx.fillStyle=c2;
    tctx.fillRect(x-w*0.08,y-bodyH,w*0.16,bodyH);
    tctx.fillRect(x-w/2,y-h*0.58,w,h*0.16);
    tctx.fillStyle=boxAo; tctx.fillRect(x-w/2,y-h*0.24,w,h*0.24);
    // 弹起旋转的盒盖+蝴蝶结
    var pop=Math.sin(Math.min(1,op*1.12)*1.5708);
    var lidY=y-h-pop*h*0.44;
    var lidRot=(idx%2?1:-1)*op*0.36;
    tctx.save();
    tctx.translate(x, lidY+lidH*0.5);
    tctx.rotate(lidRot);
    tctx.fillStyle=c1; tctx.fillRect(-w*0.52,-lidH*0.5,w*1.04,lidH);
    tctx.fillStyle='rgba(0,0,0,0.16)'; tctx.fillRect(-w*0.52,-lidH*0.5,w*1.04,lidH);
    tctx.fillStyle=c2; tctx.fillRect(-w*0.08,-lidH*0.5,w*0.16,lidH);
    tctx.beginPath();
    tctx.arc(-w*0.10,-lidH*0.5-h*0.10,w*0.09,0,6.2832);
    tctx.arc(w*0.10,-lidH*0.5-h*0.10,w*0.09,0,6.2832);
    tctx.fill();
    tctx.restore();
    tctx.restore();
  }

  function drawMeteor(t){
    if(meteor.nextAt===0){ meteor.nextAt=t+6000+Math.random()*6000; return; }
    if(!meteor.active && t>=meteor.nextAt){
      meteor.active=true; meteor.start=t; meteor.dur=750+Math.random()*250;
      var dir=Math.random()<0.5?1:-1;
      meteor.x0=CX+(dir>0?-1:1)*R*(0.28+Math.random()*0.32);
      meteor.y0=H*(0.10+Math.random()*0.13);
      meteor.dx=dir*R*(0.55+Math.random()*0.30);
      meteor.dy=H*(0.10+Math.random()*0.09);
    }
    if(!meteor.active) return;
    var p=(t-meteor.start)/meteor.dur;
    if(p>=1){
      meteor.active=false;
      meteor.nextAt=t+6000+Math.random()*6000;
      return;
    }
    var ease=1-Math.pow(1-p,1.4);
    var hx=meteor.x0+meteor.dx*ease, hy=meteor.y0+meteor.dy*ease;
    var tailFrac=0.25*Math.sin(p*3.1416);
    var tx=hx-meteor.dx*tailFrac, ty=hy-meteor.dy*tailFrac;
    var alpha=Math.min(1,p*5)*Math.pow(1-p,0.8)*0.92;
    if(alpha<=0.01) return;
    var grd=actx.createLinearGradient(tx,ty,hx,hy);
    grd.addColorStop(0,'rgba(255,250,228,0)');
    grd.addColorStop(1,'rgba(255,250,235,'+alpha.toFixed(3)+')');
    actx.strokeStyle=grd;
    actx.lineWidth=Math.max(1.2,W*0.0045);
    actx.lineCap='round';
    actx.beginPath(); actx.moveTo(tx,ty); actx.lineTo(hx,hy); actx.stroke();
    actx.fillStyle='rgba(255,255,245,'+alpha.toFixed(3)+')';
    actx.beginPath(); actx.arc(hx,hy,Math.max(1.1,W*0.0038),0,6.2832); actx.fill();
  }
  function drawAurora(t){
    actx.clearRect(0,0,W,H);
    actx.save();
    drawMoon(t);
    var ex=Math.max(0,(accum-0.35)/0.65);
    var stormTarget=Math.min(1, ex*0.65+boost*0.65);
    auroraStormMix+=(stormTarget-auroraStormMix)*0.05;
    var aVis=skyState.auroraVis;
    var at=t+auroraPhase, beatA=(1+musicBass*0.95)*(1+auroraStormMix*0.38)*aVis;
    var refRgb0='72,235,175', refRgb1='85,215,235', refSx=0;
    var adW=auroraDofLayer.width, adH=auroraDofLayer.height;
    adctx.clearRect(0,0,adW,adH);
    adctx.save();
    adctx.scale(adW/W, adH/H);
    for(var i=0;i<auroraBands.length;i++){
      var b=auroraBands[i];
      var sx=Math.sin(at*b.sp+b.ph)*W*b.amp;
      var sy=Math.cos(at*b.sp*0.8+b.ph)*H*0.02;
      var topY=H*b.y0+sy, botY=topY+H*b.h;
      var rgb2=mixRgb(b.g2,b.p2,auroraStormMix), rgb3=mixRgb(b.g3,b.p3,auroraStormMix);
      if(i===0){ refRgb0=rgb2; refSx=sx; }
      else if(i===1){ refRgb1=rgb3; }
      if(aVis<=0.02) continue;
      var grd=adctx.createLinearGradient(0,topY,0,botY);
      grd.addColorStop(0,b.c1);
      grd.addColorStop(0.38,'rgba('+rgb2+','+(b.a2*beatA).toFixed(3)+')');
      grd.addColorStop(0.72,'rgba('+rgb3+','+(b.a3*beatA).toFixed(3)+')');
      grd.addColorStop(1,b.c1);
      var xL=CX-R*0.92+sx, xR=CX+R*0.92+sx, xM=CX+sx*0.65;
      var wave=Math.sin(at*b.sp*1.5+b.ph)*H*(0.032+musicBass*0.014);
      adctx.fillStyle=grd;
      adctx.beginPath();
      adctx.moveTo(xL, topY+H*0.03);
      adctx.quadraticCurveTo(xM-R*0.25, topY-wave, xM+R*0.22, topY+wave*0.8);
      adctx.quadraticCurveTo(xR-R*0.15, topY+H*0.04, xR, topY+H*0.02);
      adctx.lineTo(xR, botY);
      adctx.quadraticCurveTo(xM+R*0.22, botY+wave*0.7, xM-R*0.22, botY-wave*0.9);
      adctx.quadraticCurveTo(xL+R*0.18, botY+H*0.03, xL, botY-H*0.01);
      adctx.closePath();

        var rx=CX+R*ry.nx+sw;
        var rTop=H*ry.y0+Math.cos(at*ry.sp*0.8+ry.ph)*H*0.012;

        var rw=W*ry.w;

        rgrd.addColorStop(0.65,'rgba('+refRgb1+','+(rayA*0.55).toFixed(3)+')');
        rgrd.addColorStop(1,'rgba('+refRgb1+',0)');
        adctx.fillStyle=rgrd;
        var bx=rx+sw*0.45;
        adctx.globalAlpha=0.55;
        adctx.beginPath();
        adctx.moveTo(rx-rw,rTop); adctx.lineTo(rx+rw,rTop);
        adctx.lineTo(bx+rw*0.85,rBot); adctx.lineTo(bx-rw*0.85,rBot);
        adctx.closePath(); adctx.fill();
        adctx.globalAlpha=0.65;
        adctx.beginPath();
        adctx.moveTo(rx-rw*0.44,rTop); adctx.lineTo(rx+rw*0.44,rTop);
        adctx.lineTo(bx+rw*0.38,rBot); adctx.lineTo(bx-rw*0.38,rBot);

    var gx=CX+refSx*0.45, gy=H*(0.888-ex*0.011), grx=W*(0.40+ex*0.03), gry=H*(0.075+ex*0.022);

    var ag=actx.createRadialGradient(gx, gy, grx*0.08, gx, gy, grx*0.92);
    ag.addColorStop(0,'rgba('+refRgb0+','+refA.toFixed(3)+')');
    ag.addColorStop(0.55,'rgba('+refRgb1+','+(refA*0.65).toFixed(3)+')');
    ag.addColorStop(1,'rgba('+refRgb1+',0)');
    actx.fillStyle=ag;
    actx.fillRect(CX-grx, gy-gry, grx*2, gry*2);

  function resetSmoke(p,randAge){
    var ch=chimneys[p.ci%chimneys.length];
    if(!ch) return;
    p.life=randAge? Math.random()*p.maxLife : 0;
    p.x=ch.x+(Math.random()-0.5)*ch.s*0.05;
    p.y=ch.y-p.life*ch.s*0.015;
    p.r=ch.s*(0.06+Math.random()*0.03);
    p.ph=Math.random()*6.2832;
    p.vx=(Math.random()-0.5)*0.08;
  }
  function initSmokes(){
    smokes.length=0;
    var thrs=[0.18,0.42,0.68];
    for(var ci=0;ci<chimneys.length;ci++){
      for(var k=0;k<8;k++){
        var extra=k>=5;
        var p={ci:ci, maxLife:95+Math.random()*35, life:0, x:0, y:0, r:2, ph:0, vx:0, extra:extra, thr:extra?thrs[k-5]:0, active:!extra};
        if(!extra) resetSmoke(p,true);
        smokes.push(p);
      }
    }
  }
  initSmokes();
  function drawSmokes(){
    if(!chimneys.length) return;
    ctx.save();
    for(var i=0;i<smokes.length;i++){
      var p=smokes[i], ch=chimneys[p.ci%chimneys.length];
      if(p.extra){
        if(!p.active){
          if(boost>=p.thr){ resetSmoke(p,false); p.active=true; }
          else continue;
        }
      }
      p.life+=1+boost*0.95;
      if(p.life>=p.maxLife){
        if(p.extra && boost<p.thr){ p.active=false; continue; }
        resetSmoke(p,false); ch=chimneys[p.ci%chimneys.length];
      }
      var pr=p.life/p.maxLife;
      p.y-=0.24*(ch.s/40+0.6)*(1+boost*1.15);
      p.x+=Math.sin(p.ph+p.life*0.06)*(0.18+boost*0.45)+p.vx;
      var rad=p.r*(1+pr*2.1);
      var alpha=Math.sin(pr*3.1416)*(0.24+boost*0.30);
      if(alpha<=0.005) continue;
      ctx.globalAlpha=alpha;
      ctx.fillStyle='#e6eef8';
      ctx.beginPath(); ctx.arc(p.x,p.y,rad,0,6.2832); ctx.fill();
    }
    ctx.restore();
  }

  function drawStreetLampGlow(t){
    if(!lampSpec) return;
    var lx=lampSpec.x, ly=lampSpec.y, lh=lampSpec.h, w=lh*0.18, headY=ly-lh*0.90;
    var pulse=0.93+0.07*Math.sin((t||0)*0.0034);
    var lvl=Math.min(1.25, 0.72+accum*0.25+boost*0.28)*pulse*(1-0.22*skyState.dawnMix+0.10*skyState.duskMix);
    var poolC0=mixRgb([255,222,165],[255,200,120],skyState.duskMix*0.65);

      poolC0=mixRgb([255,222,165],[220,244,255],skyState.dawnMix*0.60);

  function drawFootprints(){
    if(accum>prevAccum+0.004) footprintActive=true;
    prevAccum=accum;
    if(footprintActive && accum>0.38){
      var accumBoost=Math.min(1, Math.max(0, (accum-0.35)/0.65));
      footprintAlpha=Math.min(1, footprintAlpha+0.024);
      footprintReveal=Math.min(1, footprintReveal+0.0085+0.0075*accumBoost);
    } else if(footprintAlpha>0){
      footprintAlpha=Math.max(0, footprintAlpha-0.0030);
      if(footprintAlpha<=0){ footprintReveal=0; footprintActive=false; }
    }
    if(footprintAlpha<=0.005 || footprintReveal<=0.005) return;
    var cx=W/2, baseY=H*0.875, treeH=H*0.60, steps=8;
    var sx=cx+treeH*0.185, sy=baseY+treeH*0.075;
    var ex=cx+treeH*0.505, ey=baseY+treeH*0.017;
    var arcAmp=treeH*0.013;
    var baseRx=Math.max(1.8,treeH*0.0125), baseRy=Math.max(1.05,treeH*0.0070);
    ctx.save();
    for(var i=0;i<steps;i++){
      var stepFade=Math.max(0,Math.min(1,(footprintReveal-i*0.105)/0.18))*footprintAlpha;
      if(stepFade<=0.01) continue;
      var u=i/(steps-1);

      var persp=1-0.42*u;
      var depthFade=1-0.44*u;
      var px0=sx+(ex-sx)*u, py0=sy+(ey-sy)*u+Math.sin(u*3.1416)*arcAmp;
      var tx=ex-sx, ty=(ey-sy)+Math.cos(u*3.1416)*3.1416*arcAmp;
      var pathAng=Math.atan2(ty,tx), nx=-Math.sin(pathAng), ny=Math.cos(pathAng);
      var lr=(i%2===0?1:-1);
      var strideOff=lr*treeH*0.0115*persp;
      var px=px0+nx*strideOff, py=py0+ny*strideOff;
      var footAng=pathAng+lr*0.135+Math.sin(i*2.37+0.5)*0.045;
      var rx=baseRx*persp, ry=baseRy*persp;

      ctx.globalAlpha=0.66*alphaBase;
      ctx.fillStyle='#435c7c';
      ctx.beginPath(); ctx.ellipse(rx*0.18,0,rx*0.72,ry*0.92,0,0,6.2832); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-rx*0.60,0,rx*0.40,ry*0.74,0,0,6.2832); ctx.fill();
      ctx.globalAlpha=0.42*alphaBase;
      ctx.fillStyle='#6987ab';
      ctx.beginPath(); ctx.ellipse(rx*0.18,ry*0.16,rx*0.58,ry*0.68,0,0,6.2832); ctx.fill();

    }, 1000);
  });
  window.addEventListener('pointermove', function(e){
    var pIdx=findPtrIdx(e.pointerId);
    if(pIdx>=0){
      activePtrs[pIdx].x=e.clientX;
      activePtrs[pIdx].y=e.clientY;
    }
    if(isPinching && activePtrs.length>=2){
      var dist=Math.hypot(activePtrs[0].x-activePtrs[1].x, activePtrs[0].y-activePtrs[1].y);
      if(pinchStartDist>8){
        sceneZoomTarget=Math.max(0.85, Math.min(1.15, pinchStartZoom*(dist/pinchStartDist)));
      }
      return;
    }
    if(e.pointerId===dragPtrId){
      var dx=e.clientX-dragStartX, dy=e.clientY-dragStartY;
      if(!isDraggingTilt && Math.hypot(dx, dy)>14){
        isDraggingTilt=true;
        clearHold();
        clearPending();
      }
      if(isDraggingTilt){
        var sc=Math.max(0.75, W/400);
        tiltXTarget=Math.max(-14, Math.min(14, dx*0.12))*sc;
        tiltYTarget=Math.max(-10, Math.min(10, dy*0.09))*sc;
        tiltRotTarget=Math.max(-3.6, Math.min(3.6, dx*0.032));
      }
    }
  });
  function handlePtrEnd(e, isCancel){
    var pIdx=findPtrIdx(e.pointerId);
    if(pIdx>=0) activePtrs.splice(pIdx, 1);
    if(activePtrs.length<2) isPinching=false;
    if(e.pointerId===dragPtrId){
      dragPtrId=null;
      if(isDraggingTilt){
        isDraggingTilt=false;
        tiltXTarget=0; tiltYTarget=0; tiltRotTarget=0;
        clearHold(); clearPending();
        return;
      }
    }
    if(wasPinchGesture){
      if(activePtrs.length===0) wasPinchGesture=false;
      clearHold(); clearPending();
      return;
    }
    if(isCancel){
      if(e.pointerId===holdPtrId || e.pointerId===giftPendingPtrId || e.pointerId===snowmanPendingPtrId || e.pointerId===treePendingPtrId){
        clearHold(); clearPending();
      }
      return;
    }
    if(giftPendingPtrId!==null && e.pointerId===giftPendingPtrId){
      var gi=giftPendingIdx;
      clearHold(); clearPending();
      var gst=giftStates[gi];
      if(gst){
        gst.target=gst.target?0:1;
        if(gst.target===1) spawnGiftBurst(giftSpecs[gi], gi);
      }
      return;
    }
    if(snowmanPendingPtrId!==null && e.pointerId===snowmanPendingPtrId){
      clearHold(); clearPending();
      if(snowmanProg>=1 && snowmanTarget===1){
        snowmanOutfit=(snowmanOutfit+1)%snowmanOutfits.length;
        snowmanBounceStart=performance.now();
        snowmanBounceActive=true;
      }
      return;
    }
    if(treePendingPtrId!==null && e.pointerId===treePendingPtrId){
      triggerTreePulse();
      clearHold(); clearPending();
      return;
    }
    if(skyTapPending && !holdFired){
      shake();
    }
    if(e.pointerId===holdPtrId || skyTapPending){
      clearHold(); clearPending();
    }
  }
  window.addEventListener('pointerup', function(e){ handlePtrEnd(e, false); });
  window.addEventListener('pointercancel', function(e){ handlePtrEnd(e, true); });
  globe.addEventListener('wheel', function(e){
    e.preventDefault();
    var d=Math.max(-120, Math.min(120, e.deltaY));
    sceneZoomTarget=Math.max(0.85, Math.min(1.15, sceneZoomTarget-d*0.0008));
  }, {passive:false});
  globe.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  window.addEventListener('devicemotion', function(e){
    var a=e.accelerationIncludingGravity; if(!a||a.x==null) return;
    if(Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z)>26) shake();
  });
  // ---------- 昼夜切换 ----------
  document.getElementById('sky-btn').addEventListener('click', function(e){
    e.stopPropagation();
    skyMode=(skyMode+1)%3;
    skyTransActive=true;
    this.textContent='🌗 '+SKY_NAMES[skyMode];
  });
  // ---------- 灯色切换 ----------
  document.getElementById('lamp-btn').addEventListener('click', function(e){
    e.stopPropagation(); lampMode=(lampMode+1)%4;
    var names=['暖白','彩灯','红金','流水'];
    this.textContent='💡 '+names[lampMode];
  });
  // ---------- 音乐 ----------
  var bgm=document.getElementById('bgm'), bh=document.getElementById('bgm-hint'), unlocked=false;
  function initAudio(){
    if(audioInited) return;
    audioInited=true;
    try{
      if(!bgm) return;
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      audioCtx=new AC();
      if(audioCtx.state==='suspended' && audioCtx.resume){
        audioCtx.resume().catch(function(){});
      }
      var src=audioCtx.createMediaElementSource(bgm);
      analyser=audioCtx.createAnalyser();
      analyser.fftSize=256;
      analyser.smoothingTimeConstant=0.82;
      src.connect(analyser);
      analyser.connect(audioCtx.destination);
      freqData=new Uint8Array(analyser.frequencyBinCount);
    }catch(e){
      analyser=null; freqData=null;
    }
  }
  function sampleAudio(){
    if(!unlocked || !analyser || !freqData || !bgm || bgm.paused || bgm.muted){
      musicBass*=0.9; musicEnergy*=0.9;
      if(musicBass<0.002) musicBass=0;
      if(musicEnergy<0.002) musicEnergy=0;
      return;
    }
    try{
      analyser.getByteFrequencyData(freqData);
      var n=freqData.length, bassBins=Math.min(4,n), bassSum=0, totalSum=0;
      for(var i=0;i<n;i++){
        var v=freqData[i];
        if(i<bassBins) bassSum+=v;
        totalSum+=v;
      }
      var targetBass=bassBins? (bassSum/(bassBins*255)) : 0;
      var targetEnergy=n? (totalSum/(n*255)) : 0;
      targetBass=Math.min(1,Math.pow(targetBass,1.15)*1.25);
      targetEnergy=Math.min(1,Math.pow(targetEnergy,1.1)*1.3);
      musicBass+=(targetBass-musicBass)*0.24;
      musicEnergy+=(targetEnergy-musicEnergy)*0.22;
    }catch(e){
      musicBass=0; musicEnergy=0;
    }
  }
  function unlockMusic(){ if(unlocked) return; unlocked=true;
    initAudio();
    if(bgm){ bgm.muted=false; bgm.volume=0.55; bgm.play().catch(function(){}); }
    if(bh) bh.style.display='none'; }
  if(bgm){ bgm.play().catch(function(){}); }
  bh.addEventListener('click', unlockMusic);
})();
</script>
